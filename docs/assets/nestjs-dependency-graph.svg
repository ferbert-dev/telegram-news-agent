<text x="53" y="493" fill="#e6f1f8" font-size="13" font-weight="600">NewsAgentModule</text>
<text x="53" y="509" fill="#93b5c9" font-size="9.3">the composition root</text>
<text x="53" y="532" fill="#93b5c9" font-size="9.6">imports exactly ten modules</text>
<text x="53" y="549" fill="#93b5c9" font-size="9.6">and nothing else. Every gold</text>
<text x="53" y="566" fill="#93b5c9" font-size="9.6">line on this page starts here.</text>
<text x="53" y="583" fill="#93b5c9" font-size="9.6"></text>
<text x="53" y="600" fill="#93b5c9" font-size="9.6">Below it RuntimeModule starts</text>
<text x="53" y="617" fill="#93b5c9" font-size="9.6">telegram-polling, news-scheduler,</text>
<text x="53" y="634" fill="#93b5c9" font-size="9.6">telegram-news-jobs and</text>
<text x="53" y="651" fill="#93b5c9" font-size="9.6">runtime-health.</text>
