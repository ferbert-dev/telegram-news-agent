<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1290" viewBox="0 0 1760 1290" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title id="t">NestJS module dependency graph</title>
<desc id="d">Every module of the typed runtime and every import between them: the composition root, fifteen consumer modules, ten persistence and cross-cutting modules, and one database module, connected by the sixty-one edges extracted from the source.</desc>
