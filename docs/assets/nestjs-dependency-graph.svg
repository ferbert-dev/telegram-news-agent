<text x="1533" y="563" fill="#e6f1f8" font-size="13" font-weight="600">DatabaseModule</text>
<text x="1533" y="579" fill="#93b5c9" font-size="9.3">PG_POOL . DRIZZLE_DB</text>
<text x="1533" y="602" fill="#93b5c9" font-size="9.6">DATABASE_LIFECYCLE</text>
