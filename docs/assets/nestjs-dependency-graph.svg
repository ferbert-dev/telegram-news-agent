<text x="40" y="52" fill="url(#tg)" font-size="26" font-weight="700">NestJS module dependency graph</text>
<text x="40" y="78" fill="#8fb3c7" font-size="13">31 modules, 61 edges. Every line is an import that exists in the source; the picture is generated from it, so it cannot drift.</text>
<line x1="40" y1="104" x2="66" y2="104" stroke="#e9c46a" stroke-width="2.4"/>
<text x="74" y="108" fill="#8fb3c7" font-size="10.5">the composition root wires this</text>
<line x1="376" y1="104" x2="402" y2="104" stroke="#72cfd0" stroke-width="2.4"/>
<text x="410" y="108" fill="#8fb3c7" font-size="10.5">application depends on persistence</text>
<line x1="712" y1="104" x2="738" y2="104" stroke="#8de4d1" stroke-width="2.4"/>
<text x="746" y="108" fill="#8fb3c7" font-size="10.5">the research composition</text>
<line x1="1048" y1="104" x2="1074" y2="104" stroke="#7f8fb5" stroke-width="2.4"/>
<text x="1082" y="108" fill="#8fb3c7" font-size="10.5">a bus: one line, many endpoints</text>
<line x1="1384" y1="104" x2="1410" y2="104" stroke="#6d91a0" stroke-width="2.4"/>
<text x="1418" y="108" fill="#8fb3c7" font-size="10.5">superseded, still in the tree</text>
<text x="40" y="1252" fill="#7f9db1" font-size="11">Arrows point from the module that imports to the module it imports. The graph is acyclic and forwardRef-free by rule, and npm run test:architecture fails the build if that stops being true.</text>
<text x="40" y="1272" fill="#7f9db1" font-size="11">Read a column as a permission: nothing in persistence may point left, and nothing may point back into the root. legacy-research-execution has no inbound edge at all - typed-research-execution replaced it.</text>
</svg>
