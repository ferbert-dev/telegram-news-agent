<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title id="t">NestJS module architecture of Telegram News Agent</title>
  <desc id="d">Layered map of the typed NestJS runtime: the composition root and its four workers, eight application modules, seven gateway and cross-cutting modules, nine persistence modules, one database module, and the four sanctioned legacy seams.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/><stop offset="0.55" stop-color="#0b1d2a"/><stop offset="1" stop-color="#102419"/>
    </linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#53c7ff"/><stop offset="0.55" stop-color="#8de4d1"/><stop offset="1" stop-color="#f5d47a"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#9dd7c8" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.30"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#72cfd0"/>
    </marker>
  </defs>
  <rect width="1600" height="960" fill="url(#bg)"/><rect width="1600" height="960" fill="url(#grid)"/>
  <text x="40" y="54" fill="url(#tg)" font-size="27" font-weight="700">NestJS module architecture</text>
  <text x="40" y="80" fill="#8fb3c7" font-size="13.5">The typed runtime carried in <tspan fill="#cfe3ef">dist/</tspan> and selected by <tspan fill="#cfe3ef">BOT_ENTRYPOINT</tspan>. Acyclic by rule, no forwardRef, checked by <tspan fill="#cfe3ef">npm run test:architecture</tspan>.</text>
  <text x="1560" y="54" text-anchor="end" fill="#f5d47a" font-size="12.5" font-weight="600">31 modules &#183; dependencies point downwards only</text>
  <text x="40" y="108" fill="#8de4d1" font-size="12" font-weight="700" letter-spacing="1.6">COMPOSITION ROOT AND RUNTIME</text>
  <rect x="40.0" y="118" width="360.0" height="96" rx="10" fill="#11283a" stroke="#2b4a63" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="40.0" y="118" width="360.0" height="3" rx="1.5" fill="#53c7ff"/>
  <text x="220.0" y="162.0" text-anchor="middle" fill="#e6f1f8" font-size="14" font-weight="600">composition/runtime-entry.ts</text>
  <text x="220.0" y="179.0" text-anchor="middle" fill="#93b5c9" font-size="10.5">boots the standalone context</text>
  <text x="220.0" y="192.0" text-anchor="middle" fill="#93b5c9" font-size="10.5">owns signals and shutdown</text>
  <rect x="430.0" y="118" width="690.0" height="96" rx="10" fill="#13314a" stroke="#35678a" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="430.0" y="118" width="690.0" height="3" rx="1.5" fill="#8de4d1"/>
  <text x="775.0" y="162.0" text-anchor="middle" fill="#e6f1f8" font-size="14" font-weight="600">NewsAgentModule</text>
  <text x="775.0" y="179.0" text-anchor="middle" fill="#93b5c9" font-size="10.5">ai-providers &#183; database &#183; editorial-application &#183; editorial-persistence &#183; operations-application</text>
  <text x="775.0" y="192.0" text-anchor="middle" fill="#93b5c9" font-size="10.5">persistence-facade &#183; scheduler-application &#183; telegram-control-application</text>
  <text x="775.0" y="205.0" text-anchor="middle" fill="#93b5c9" font-size="10.5">telegram-persistence &#183; typed-research-execution</text>
  <rect x="1150.0" y="118" width="410.0" height="96" rx="10" fill="#17352e" stroke="#2f6a5b" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="1150.0" y="118" width="410.0" height="3" rx="1.5" fill="#8de4d1"/>
  <text x="1355.0" y="162.0" text-anchor="middle" fill="#e6f1f8" font-size="14" font-weight="600">RuntimeModule</text>
  <text x="1355.0" y="179.0" text-anchor="middle" fill="#93b5c9" font-size="10.5">telegram-polling &#8594; news-scheduler</text>
  <text x="1355.0" y="192.0" text-anchor="middle" fill="#93b5c9" font-size="10.5">&#8594; telegram-news-jobs &#8594; runtime-health</text>
  <text x="1355.0" y="205.0" text-anchor="middle" fill="#93b5c9" font-size="10.5">stopped in reverse order</text>
