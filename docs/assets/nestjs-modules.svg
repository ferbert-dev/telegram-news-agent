  <text x="40" y="898" fill="#7f9db1" font-size="11.5">&#8220;Typed&#8221; means typed orchestration, not an absent seam: <tspan fill="#cfe3ef">typed-research-execution</tspan> still reaches feed.js, ai-usage.js, excluded-topic-policy.js and news-settings.js.</text>
  <text x="40" y="918" fill="#7f9db1" font-size="11.5">That shrinking list is the real measure of how much porting is left. Legacy stays in the image through cutover and one stable release &#8212; it <tspan fill="#cfe3ef">is</tspan> the rollback.</text>
