<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">Telegram News Agent runtime dependency graph</title>
  <desc id="desc">A curated high-level view of the Graphify code graph showing source ingestion, orchestration, editorial intelligence, AI providers, delivery, and PostgreSQL persistence.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f4e8"/>
      <stop offset="0.55" stop-color="#f3efe3"/>
      <stop offset="1" stop-color="#e8f0eb"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#17324d" opacity="0.08"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#18324b" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-runtime" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#17324d"/>
    </marker>
    <marker id="arrow-evidence" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#e76f51"/>
    </marker>
    <marker id="arrow-ai" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#21867a"/>
    </marker>
    <marker id="arrow-data" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#3976a8"/>
    </marker>
    <style>
      .title { font: 700 38px 'Avenir Next', 'IBM Plex Sans', sans-serif; fill: #102a43; letter-spacing: -0.8px; }
      .subtitle { font: 500 17px 'Avenir Next', 'IBM Plex Sans', sans-serif; fill: #526878; }
      .eyebrow { font: 700 12px 'Avenir Next', 'IBM Plex Sans', sans-serif; fill: #e76f51; letter-spacing: 2.4px; }
      .column { font: 700 12px 'Avenir Next', 'IBM Plex Sans', sans-serif; fill: #657985; letter-spacing: 1.8px; }
      .node-title { font: 700 16px 'Avenir Next', 'IBM Plex Sans', sans-serif; fill: #17324d; }
      .node-title-light { font: 700 16px 'Avenir Next', 'IBM Plex Sans', sans-serif; fill: #ffffff; }
      .node-sub { font: 500 12px 'Avenir Next', 'IBM Plex Sans', sans-serif; fill: #687b86; }
      .node-sub-light { font: 500 12px 'Avenir Next', 'IBM Plex Sans', sans-serif; fill: #d7e7e4; }
      .edge-label { font: 700 10px 'Avenir Next', 'IBM Plex Sans', sans-serif; fill: #687b86; letter-spacing: 0.7px; }
      .legend { font: 600 12px 'Avenir Next', 'IBM Plex Sans', sans-serif; fill: #526878; }
      .edge-runtime { fill: none; stroke: #17324d; stroke-width: 2.4; marker-end: url(#arrow-runtime); }
      .edge-evidence { fill: none; stroke: #e76f51; stroke-width: 2.8; marker-end: url(#arrow-evidence); }
      .edge-ai { fill: none; stroke: #21867a; stroke-width: 2.6; marker-end: url(#arrow-ai); }
      .edge-data { fill: none; stroke: #3976a8; stroke-width: 2.2; marker-end: url(#arrow-data); }
      .edge-optional { stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect width="1800" height="1080" rx="30" fill="url(#background)"/>
  <rect width="1800" height="1080" rx="30" fill="url(#grid)"/>
  <path d="M0 0 H1800 V118 C1470 80 1280 168 980 120 C630 64 400 168 0 104 Z" fill="#17324d" opacity="0.035"/>

  <text x="70" y="48" class="eyebrow">GRAPHIFY / ARCHITECTURE</text>
  <text x="70" y="92" class="title">Telegram News Agent · Runtime Dependency Graph</text>
  <text x="70" y="122" class="subtitle">Curated production flow from the code graph · real modules, providers, evidence and persistence paths</text>

  <g transform="translate(1330 48)">
    <rect width="118" height="54" rx="18" fill="#ffffff" opacity="0.82" stroke="#cbd8d5"/>
    <text x="59" y="24" text-anchor="middle" class="node-title">1,107</text>
    <text x="59" y="42" text-anchor="middle" class="node-sub">nodes</text>
  </g>
  <g transform="translate(1462 48)">
    <rect width="118" height="54" rx="18" fill="#ffffff" opacity="0.82" stroke="#cbd8d5"/>
    <text x="59" y="24" text-anchor="middle" class="node-title">2,046</text>
    <text x="59" y="42" text-anchor="middle" class="node-sub">edges</text>
  </g>
  <g transform="translate(1594 48)">
    <rect width="136" height="54" rx="18" fill="#17324d"/>
    <text x="68" y="24" text-anchor="middle" class="node-title-light">84</text>
    <text x="68" y="42" text-anchor="middle" class="node-sub-light">communities</text>
  </g>

