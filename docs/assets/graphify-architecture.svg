  <text x="380" y="178" class="column">02 · ORCHESTRATION</text>
  <text x="710" y="178" class="column">03 · EDITORIAL INTELLIGENCE</text>
  <text x="1060" y="178" class="column">04 · PROVIDERS</text>
  <text x="1400" y="178" class="column">05 · DELIVERY</text>

