<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Telegram News Agent production architecture</title>
  <desc id="desc">Dependency map showing news sources, Exa research, OpenAI and Gemini generation, the grounded pipeline, PostgreSQL, Telegram controls, and Oracle deployment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1d2a"/>
      <stop offset="1" stop-color="#102419"/>
    </linearGradient>
    <linearGradient id="titleGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#53c7ff"/>
      <stop offset="0.55" stop-color="#8de4d1"/>
      <stop offset="1" stop-color="#f5d47a"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#9dd7c8" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#72cfd0"/>
    </marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e9c46a"/>
    </marker>
    <style>
      .title { font: 700 52px 'Avenir Next', 'Trebuchet MS', sans-serif; fill: url(#titleGradient); }
      .subtitle { font: 400 19px 'Avenir Next', 'Trebuchet MS', sans-serif; fill: #a8bdc9; }
      .section { font: 700 15px 'Avenir Next', 'Trebuchet MS', sans-serif; letter-spacing: 2px; fill: #79d8d2; }
      .node-title { font: 700 20px 'Avenir Next', 'Trebuchet MS', sans-serif; fill: #eef8f4; }
      .node-copy { font: 400 14px 'Avenir Next', 'Trebuchet MS', sans-serif; fill: #a9c1c7; }
      .small { font: 600 12px 'Avenir Next', 'Trebuchet MS', sans-serif; letter-spacing: 1px; }
      .edge { fill: none; stroke: #72cfd0; stroke-width: 2.5; stroke-opacity: 0.78; marker-end: url(#arrow); }
      .edge-gold { fill: none; stroke: #e9c46a; stroke-width: 2.5; stroke-opacity: 0.82; marker-end: url(#arrowGold); }
      .edge-soft { fill: none; stroke: #6d91a0; stroke-width: 2; stroke-dasharray: 7 7; stroke-opacity: 0.65; marker-end: url(#arrow); }
      .bus { fill: none; stroke: #4f8192; stroke-width: 2; stroke-opacity: 0.7; }
    </style>
  </defs>

  <rect width="1600" height="1000" rx="30" fill="url(#bg)"/>
  <rect width="1600" height="1000" rx="30" fill="url(#grid)"/>
  <circle cx="1430" cy="120" r="210" fill="#28b89c" opacity="0.07"/>
  <circle cx="140" cy="900" r="240" fill="#3aa8ff" opacity="0.06"/>

  <text x="70" y="82" class="title">Telegram News Agent</text>
  <text x="72" y="120" class="subtitle">Grounded news research, editorial control, and health-gated production delivery</text>

  <g transform="translate(1120 54)">
    <rect width="132" height="34" rx="17" fill="#153e38" stroke="#4bd4ad"/>
    <text x="66" y="22" text-anchor="middle" class="small" fill="#79f0c8">PRODUCTION</text>
    <rect x="144" width="112" height="34" rx="17" fill="#142f48" stroke="#53bfff"/>
    <text x="200" y="22" text-anchor="middle" class="small" fill="#82d7ff">f0afa2e</text>
    <rect x="268" width="142" height="34" rx="17" fill="#49391c" stroke="#e9c46a"/>
    <text x="339" y="22" text-anchor="middle" class="small" fill="#f5d47a">EXA ENABLED</text>
  </g>

  <text x="70" y="182" class="section">DISCOVER</text>
  <text x="360" y="182" class="section">RESEARCH AND GENERATE</text>
  <text x="690" y="182" class="section">GROUND AND DECIDE</text>
  <text x="1070" y="182" class="section">CONTROL AND PERSIST</text>
  <text x="1370" y="182" class="section">DELIVER</text>

  <!-- Dependency connectors render beneath opaque cards so labels stay clear. -->
  <g id="dependency-edges">
    <path d="M290 256 H320" class="bus"/>
    <path d="M290 372 H320" class="bus"/>
    <path d="M290 488 H320" class="bus"/>
    <path d="M320 256 V604 H655 V244 H680" class="edge"/>
    <path d="M620 246 H680" class="edge-gold"/>
    <path d="M620 286 H642 V472 H680" class="edge-gold"/>
    <path d="M620 396 H650 V492 H680" class="edge"/>
    <path d="M620 512 H680" class="edge"/>
    <path d="M820 302 V326" class="edge"/>
    <path d="M820 418 V442" class="edge"/>
    <path d="M960 256 H1040" class="edge"/>
    <path d="M960 372 H1000 V406 H1040" class="edge-soft"/>
    <path d="M960 498 H1000 V536 H1040" class="edge-gold"/>
    <path d="M1180 322 V350" class="edge-soft"/>
    <path d="M1180 462 V490" class="edge"/>
    <path d="M1320 536 H1340 V312 H1360" class="edge-gold"/>
    <path d="M1320 406 H1340 V466 H1360" class="edge"/>
    <path d="M320 769 H380" class="edge"/>
    <path d="M610 769 H670" class="edge"/>
    <path d="M900 769 H960" class="edge"/>
    <path d="M1210 769 H1270" class="edge-gold"/>
    <path d="M1085 722 V640 H1180 V582" class="edge-soft"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="60" y="210" width="230" height="92" rx="16" fill="#11283a" stroke="#407b98"/>
    <text x="82" y="245" class="node-title">RSS / Atom</text>
    <text x="82" y="270" class="node-copy">Configured publishers and feeds</text>

    <rect x="60" y="326" width="230" height="92" rx="16" fill="#11283a" stroke="#407b98"/>
    <text x="82" y="361" class="node-title">Google News</text>
    <text x="82" y="386" class="node-copy">Topic discovery and URL resolution</text>

    <rect x="60" y="442" width="230" height="92" rx="16" fill="#11283a" stroke="#407b98"/>
    <text x="82" y="477" class="node-title">GDELT</text>
    <text x="82" y="502" class="node-copy">Global event discovery</text>

    <rect x="350" y="210" width="270" height="112" rx="18" fill="#15352f" stroke="#49d1a8" stroke-width="2"/>
    <text x="374" y="248" class="node-title">Exa Search</text>
    <text x="374" y="276" class="node-copy">Feeds, news, article detail, facts</text>
    <text x="374" y="299" class="node-copy">Bounded to max 3 detail searches/article</text>

    <rect x="350" y="350" width="270" height="92" rx="16" fill="#172d45" stroke="#4ba8e8"/>
    <text x="374" y="385" class="node-title">OpenAI</text>
    <text x="374" y="410" class="node-copy">Structured generation and curation</text>

    <rect x="350" y="466" width="270" height="92" rx="16" fill="#172d45" stroke="#4ba8e8"/>
    <text x="374" y="501" class="node-title">Gemini</text>
    <text x="374" y="526" class="node-copy">Configured generation fallback</text>

    <rect x="680" y="210" width="280" height="92" rx="16" fill="#172638" stroke="#557b9b"/>
    <text x="704" y="245" class="node-title">Ingest and normalize</text>
    <text x="704" y="270" class="node-copy">Canonical URLs, extraction, source policy</text>

    <rect x="680" y="326" width="280" height="92" rx="16" fill="#172638" stroke="#557b9b"/>
    <text x="704" y="361" class="node-title">Rank and deduplicate</text>
    <text x="704" y="386" class="node-copy">History, semantic decisions, follow-ups</text>

    <rect x="680" y="442" width="280" height="112" rx="16" fill="#2d2a1d" stroke="#d4ad50"/>
    <text x="704" y="480" class="node-title">Grounded draft</text>
    <text x="704" y="508" class="node-copy">Exact evidence map and source URLs</text>
    <text x="704" y="531" class="node-copy">Baseline preserved during enrichment</text>

    <rect x="1040" y="210" width="280" height="112" rx="18" fill="#192b27" stroke="#5dc0a6"/>
    <text x="1064" y="248" class="node-title">PostgreSQL</text>
    <text x="1064" y="276" class="node-copy">Authoritative state, usage, settings</text>
    <text x="1064" y="299" class="node-copy">Atomic leases, review, publish, schedule</text>

    <rect x="1040" y="350" width="280" height="112" rx="16" fill="#22283b" stroke="#7c91d9"/>
    <text x="1064" y="388" class="node-title">Private Telegram UI</text>
    <text x="1064" y="416" class="node-copy">/news  /settings  /labs  /stats</text>
    <text x="1064" y="439" class="node-copy">/status and explicit Test Exa</text>

    <rect x="1040" y="490" width="280" height="92" rx="16" fill="#2c2a21" stroke="#d4ad50"/>
    <text x="1064" y="525" class="node-title">Review and publish</text>
    <text x="1064" y="550" class="node-copy">Manual or policy-gated atomic claim</text>

    <rect x="1360" y="266" width="190" height="92" rx="16" fill="#17352e" stroke="#52c99f"/>
    <text x="1384" y="301" class="node-title">News channel</text>
    <text x="1384" y="326" class="node-copy">Idempotent publication</text>

    <rect x="1360" y="410" width="190" height="112" rx="16" fill="#263020" stroke="#d4ad50"/>
    <text x="1384" y="448" class="node-title">Owner chat</text>
    <text x="1384" y="476" class="node-copy">Review cards, status,</text>
    <text x="1384" y="499" class="node-copy">release notifications</text>
  </g>


  <g filter="url(#shadow)">
    <rect x="60" y="650" width="1490" height="220" rx="24" fill="#0d1824" stroke="#28465a"/>
    <text x="90" y="690" class="section">SHIP AND OPERATE</text>

    <rect x="90" y="722" width="230" height="94" rx="16" fill="#172638" stroke="#557b9b"/>
    <text x="114" y="758" class="node-title">GitHub Actions</text>
    <text x="114" y="783" class="node-copy">Tests, migrations, integration</text>

    <rect x="380" y="722" width="230" height="94" rx="16" fill="#172638" stroke="#557b9b"/>
    <text x="404" y="758" class="node-title">Immutable GHCR</text>
    <text x="404" y="783" class="node-copy">Commit-tagged ARM64 image</text>

    <rect x="670" y="722" width="230" height="94" rx="16" fill="#17352e" stroke="#52c99f"/>
    <text x="694" y="758" class="node-title">Oracle VM</text>
    <text x="694" y="783" class="node-copy">Compose, bot, PostgreSQL</text>

    <rect x="960" y="722" width="250" height="94" rx="16" fill="#263020" stroke="#d4ad50"/>
    <text x="984" y="758" class="node-title">Health gates</text>
    <text x="984" y="783" class="node-copy">DB, runtime, Telegram, channel</text>

    <rect x="1270" y="722" width="250" height="94" rx="16" fill="#263020" stroke="#d4ad50"/>
    <text x="1294" y="758" class="node-title">Version notification</text>
    <text x="1294" y="783" class="node-copy">Private and same-image safe</text>
  </g>


  <rect x="60" y="910" width="1490" height="52" rx="16" fill="#162735" stroke="#36586c"/>
  <text x="90" y="943" class="small" fill="#84d5ef">MIGRATION LANE</text>
  <text x="250" y="943" class="node-copy">Typed NestJS and Drizzle slices coexist with the production Node entrypoint until clean-database parity, Docker smoke, shutdown, and rollback gates pass.</text>
</svg>
