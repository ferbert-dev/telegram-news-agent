  <path class="edge-runtime" d="M320 255 C345 255 355 255 380 255"/>
  <path class="edge-runtime" d="M320 415 C350 415 350 535 380 535"/>
  <path class="edge-runtime" d="M320 575 C348 575 350 675 380 675"/>
  <path class="edge-runtime" d="M510 300 L510 350"/>
