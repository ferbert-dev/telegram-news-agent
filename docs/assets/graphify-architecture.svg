  <path class="edge-data" d="M850 720 C850 790 780 835 735 875"/>
  <path class="edge-data" d="M1530 580 C1530 760 1450 825 1340 875"/>
  <path class="edge-data" d="M1530 720 C1530 805 1435 840 1340 875"/>

  <text x="332" y="245" class="edge-label">UPDATES</text>
  <text x="660" y="248" class="edge-label">RUN</text>
  <text x="1008" y="274" class="edge-label">ROUTE</text>
  <text x="1210" y="445" class="edge-label">FACTS</text>
  <text x="1210" y="665" class="edge-label">DRAFT</text>
  <text x="1290" y="492" class="edge-label">GROUNDED ARTICLE</text>

