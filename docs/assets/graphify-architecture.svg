  <path class="edge-ai" d="M990 255 C1025 255 1028 285 1060 285"/>
  <path class="edge-ai" d="M990 395 C1028 395 1025 285 1060 285"/>
  <path class="edge-ai" d="M1185 330 L1185 410"/>
