<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" role="img" aria-labelledby="title desc">
  <title id="title">Telegram News Agent: one run through the NestJS runtime, left to right</title>
  <desc id="desc">Five numbered stages read left to right: a trigger, admission, research, writing and the publication decision, delivery. Underneath, the services every stage calls, then the composition root and lifecycle, then the legacy seams.</desc>
    <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1d2a"/>
      <stop offset="1" stop-color="#102419"/>
    </linearGradient>
    <linearGradient id="titleGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#53c7ff"/>
      <stop offset="0.55" stop-color="#8de4d1"/>
      <stop offset="1" stop-color="#f5d47a"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#9dd7c8" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#72cfd0"/>
    </marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e9c46a"/>
    </marker>
    <style>
      .title { font: 700 52px 'Avenir Next', 'Trebuchet MS', sans-serif; fill: url(#titleGradient); }
      .subtitle { font: 400 19px 'Avenir Next', 'Trebuchet MS', sans-serif; fill: #a8bdc9; }
      .section { font: 700 15px 'Avenir Next', 'Trebuchet MS', sans-serif; letter-spacing: 2px; fill: #79d8d2; }
      .node-title { font: 700 20px 'Avenir Next', 'Trebuchet MS', sans-serif; fill: #eef8f4; }
      .node-copy { font: 400 14px 'Avenir Next', 'Trebuchet MS', sans-serif; fill: #a9c1c7; }
      .small { font: 600 12px 'Avenir Next', 'Trebuchet MS', sans-serif; letter-spacing: 1px; }
      .edge { fill: none; stroke: #72cfd0; stroke-width: 2.5; stroke-opacity: 0.78; marker-end: url(#arrow); }
      .edge-gold { fill: none; stroke: #e9c46a; stroke-width: 2.5; stroke-opacity: 0.82; marker-end: url(#arrowGold); }
      .edge-soft { fill: none; stroke: #6d91a0; stroke-width: 2; stroke-dasharray: 7 7; stroke-opacity: 0.65; marker-end: url(#arrow); }
      .bus { fill: none; stroke: #4f8192; stroke-width: 2; stroke-opacity: 0.7; }
    </style>
  </defs>
  <rect width="1600" height="1130" fill="url(#bg)"/><rect width="1600" height="1130" fill="url(#grid)"/>
  <text x="70" y="80" class="title">Telegram News Agent</text>
  <text x="72" y="120" class="subtitle">An AI news desk on a typed NestJS runtime. One run, left to right.</text>
  <rect x="1120" y="52" width="150" height="36" rx="18" fill="#12352c" stroke="#3f9c78" stroke-width="1.5"/>
  <text x="1195.0" y="76" text-anchor="middle" class="small" fill="#7fe0b6">PRODUCTION</text>
  <rect x="1284" y="52" width="120" height="36" rx="18" fill="#12283d" stroke="#3f7fb0" stroke-width="1.5"/>
  <text x="1344.0" y="76" text-anchor="middle" class="small" fill="#8fc6ef">v2.0.0</text>
  <rect x="1418" y="52" width="132" height="36" rx="18" fill="#33280f" stroke="#a8802e" stroke-width="1.5"/>
  <text x="1484.0" y="76" text-anchor="middle" class="small" fill="#f0c672">NESTJS</text>
  <circle cx="71" cy="170" r="12" fill="#12352c" stroke="#49d1a8" stroke-width="1.5"/>
  <text x="71" y="175" text-anchor="middle" class="small" fill="#7fe0b6">1</text>
  <text x="92" y="176" class="section">TRIGGER</text>
  <circle cx="361" cy="170" r="12" fill="#12352c" stroke="#49d1a8" stroke-width="1.5"/>
  <text x="361" y="175" text-anchor="middle" class="small" fill="#7fe0b6">2</text>
  <text x="382" y="176" class="section">ADMIT</text>
  <circle cx="691" cy="170" r="12" fill="#12352c" stroke="#49d1a8" stroke-width="1.5"/>
  <text x="691" y="175" text-anchor="middle" class="small" fill="#7fe0b6">3</text>
  <text x="712" y="176" class="section">RESEARCH</text>
  <circle cx="1051" cy="170" r="12" fill="#12352c" stroke="#49d1a8" stroke-width="1.5"/>
  <text x="1051" y="175" text-anchor="middle" class="small" fill="#7fe0b6">4</text>
  <text x="1072" y="176" class="section">WRITE AND DECIDE</text>
  <circle cx="1371" cy="170" r="12" fill="#12352c" stroke="#49d1a8" stroke-width="1.5"/>
  <text x="1371" y="175" text-anchor="middle" class="small" fill="#7fe0b6">5</text>
  <text x="1392" y="176" class="section">DELIVER</text>
  <rect x="60" y="210" width="230" height="112" rx="16" fill="#11283a" stroke="#407b98" stroke-width="1" filter="url(#shadow)"/>
  <text x="82" y="248" class="node-title">telegram-polling</text>
  <text x="82" y="274" class="node-copy">a /news tap, Publish</text>
  <text x="82" y="296" class="node-copy">or Reject</text>
  <rect x="60" y="346" width="230" height="92" rx="16" fill="#11283a" stroke="#407b98" stroke-width="1" filter="url(#shadow)"/>
  <text x="82" y="384" class="node-title">news-scheduler</text>
  <text x="82" y="410" class="node-copy">a tick every 3 hours</text>
  <rect x="350" y="210" width="270" height="134" rx="16" fill="#2d2a1d" stroke="#d4ad50" stroke-width="2" filter="url(#shadow)"/>
  <text x="372" y="248" class="node-title">Admit or refuse</text>
  <text x="372" y="274" class="node-copy">One job per channel.</text>
  <text x="372" y="296" class="node-copy">Quiet hours defers here,</text>
  <text x="372" y="318" class="node-copy">before anything is called</text>
  <rect x="350" y="368" width="270" height="112" rx="16" fill="#172638" stroke="#557b9b" stroke-width="1" filter="url(#shadow)"/>
  <text x="372" y="406" class="node-title">Pipeline lease</text>
  <text x="372" y="432" class="node-copy">One run at a time,</text>
  <text x="372" y="454" class="node-copy">across the database</text>
  <rect x="680" y="210" width="280" height="134" rx="16" fill="#172638" stroke="#557b9b" stroke-width="1" filter="url(#shadow)"/>
  <text x="702" y="248" class="node-title">Research execution</text>
  <text x="702" y="274" class="node-copy">Curate candidates, drop the</text>
  <text x="702" y="296" class="node-copy">duplicates, then fetch the one</text>
  <text x="702" y="318" class="node-copy">full text the article uses</text>
  <rect x="680" y="368" width="280" height="112" rx="16" fill="#172638" stroke="#557b9b" stroke-width="1" filter="url(#shadow)"/>
  <text x="702" y="406" class="node-title">source-acquisition</text>
  <text x="702" y="432" class="node-copy">RSS, Reddit, GDELT</text>
  <text x="702" y="454" class="node-copy">Free, and always tried first</text>
  <rect x="1040" y="210" width="280" height="112" rx="16" fill="#192b27" stroke="#5dc0a6" stroke-width="2" filter="url(#shadow)"/>
  <text x="1062" y="248" class="node-title">Editorial pass</text>
  <text x="1062" y="274" class="node-copy">Corroborate, keep the baseline,</text>
  <text x="1062" y="296" class="node-copy">then enrich to 185-220 words</text>
  <rect x="1040" y="346" width="280" height="112" rx="16" fill="#22283b" stroke="#7c91d9" stroke-width="1" filter="url(#shadow)"/>
  <text x="1062" y="384" class="node-title">Review draft</text>
  <text x="1062" y="410" class="node-copy">Body, evidence map, topics, tags</text>
  <text x="1062" y="432" class="node-copy">A card with Publish and Reject</text>
  <rect x="1040" y="482" width="280" height="112" rx="16" fill="#2d2a1d" stroke="#d4ad50" stroke-width="1" filter="url(#shadow)"/>
  <text x="1062" y="520" class="node-title">Publication gate</text>
  <text x="1062" y="546" class="node-copy">Excluded topics refuse here.</text>
  <text x="1062" y="568" class="node-copy">Tap or automatic - one claim</text>
  <rect x="1360" y="266" width="190" height="92" rx="16" fill="#17352e" stroke="#52c99f" stroke-width="1" filter="url(#shadow)"/>
  <text x="1382" y="304" class="node-title">News channel</text>
  <text x="1382" y="330" class="node-copy">Published once</text>
  <rect x="1360" y="410" width="190" height="112" rx="16" fill="#263020" stroke="#d4ad50" stroke-width="1" filter="url(#shadow)"/>
  <text x="1382" y="448" class="node-title">Owner chat</text>
  <text x="1382" y="474" class="node-copy">Review cards, status</text>
  <text x="1382" y="496" class="node-copy">and failures</text>
  <path d="M290 266 H346" class="edge"/>
  <path d="M290 392 H320 V300 H346" class="edge"/>
  <path d="M490 344 V364" class="edge"/>
  <path d="M620 424 H650 V284 H676" class="edge"/>
  <path d="M820 368 V348" class="edge"/>
  <path d="M960 266 H1036" class="edge-gold"/>
  <path d="M1180 322 V342" class="edge"/>
  <path d="M1180 458 V478" class="edge"/>
  <path d="M1320 538 H1338 V312 H1357" class="edge-gold"/>
  <path d="M1320 402 H1344 V446 H1357" class="edge"/>
  <path d="M1320 538 H1332 V486 H1357" class="edge"/>
  <path d="M636 624 V240 H676" class="edge-soft"/>
  <path d="M1000 624 V300 H1036" class="edge-soft"/>
  <rect x="60" y="624" width="1480" height="166" rx="22" fill="#0a1a26" fill-opacity="0.72" stroke="#1d3a4a" stroke-width="1.5"/>
  <text x="90" y="662" class="section">SHARED SERVICES</text>
  <text x="272" y="662" class="node-copy">called from stages 3 and 4, so they are not drawn as a stage of their own</text>
  <rect x="90" y="678" width="420" height="92" rx="16" fill="#15352f" stroke="#49d1a8" stroke-width="1" filter="url(#shadow)"/>
  <text x="112" y="716" class="node-title">Exa</text>
  <text x="112" y="742" class="node-copy">Paid search, only when the feeds fall short</text>
  <rect x="546" y="678" width="440" height="92" rx="16" fill="#172d45" stroke="#4ba8e8" stroke-width="1" filter="url(#shadow)"/>
  <text x="568" y="716" class="node-title">AI providers</text>
  <text x="568" y="742" class="node-copy">OpenAI, then Gemini, then OpenRouter</text>
  <rect x="1022" y="678" width="498" height="92" rx="16" fill="#192b27" stroke="#5dc0a6" stroke-width="1" filter="url(#shadow)"/>
  <text x="1044" y="716" class="node-title">PostgreSQL</text>
  <text x="1044" y="742" class="node-copy">Every lease, checkpoint, draft and publication</text>
  <rect x="60" y="822" width="1480" height="192" rx="22" fill="#0a1a26" fill-opacity="0.72" stroke="#1d3a4a" stroke-width="1.5"/>
  <text x="90" y="860" class="section">COMPOSITION AND LIFECYCLE</text>
  <rect x="90" y="878" width="230" height="112" rx="16" fill="#172638" stroke="#557b9b" stroke-width="1" filter="url(#shadow)"/>
  <text x="112" y="916" class="node-title">NewsAgentModule</text>
  <text x="112" y="942" class="node-copy">The composition root.</text>
  <text x="112" y="964" class="node-copy">Ten imports, no more</text>
  <rect x="380" y="878" width="230" height="112" rx="16" fill="#172638" stroke="#557b9b" stroke-width="1" filter="url(#shadow)"/>
  <text x="402" y="916" class="node-title">RuntimeModule</text>
  <text x="402" y="942" class="node-copy">Starts four workers,</text>
  <text x="402" y="964" class="node-copy">stops them in reverse</text>
  <rect x="670" y="878" width="230" height="112" rx="16" fill="#17352e" stroke="#52c99f" stroke-width="1" filter="url(#shadow)"/>
  <text x="692" y="916" class="node-title">DatabaseModule</text>
  <text x="692" y="942" class="node-copy">One pool, one Drizzle</text>
  <text x="692" y="964" class="node-copy">provider, one shutdown</text>
  <rect x="960" y="878" width="250" height="112" rx="16" fill="#263020" stroke="#d4ad50" stroke-width="1" filter="url(#shadow)"/>
  <text x="982" y="916" class="node-title">Health gate</text>
  <text x="982" y="942" class="node-copy">Running, never restarted,</text>
  <text x="982" y="964" class="node-copy">healthy and still polling</text>
  <rect x="1270" y="878" width="250" height="112" rx="16" fill="#263020" stroke="#d4ad50" stroke-width="1" filter="url(#shadow)"/>
  <text x="1292" y="916" class="node-title">Release</text>
  <text x="1292" y="942" class="node-copy">No health, no release.</text>
  <text x="1292" y="964" class="node-copy">Rollback is one env line</text>
  <path d="M320 934 H380" class="edge-gold"/>
  <path d="M610 934 H670" class="edge-gold"/>
  <path d="M900 934 H960" class="edge-gold"/>
  <path d="M1210 934 H1270" class="edge-gold"/>
  <rect x="60" y="1042" width="1480" height="66" rx="18" fill="#0a1a26" fill-opacity="0.72" stroke="#1d3a4a" stroke-width="1.5"/>
  <text x="90" y="1071" class="small" fill="#79d8d2">LEGACY SEAMS</text>
  <text x="90" y="1095" class="node-copy">Four legacy-*.gateway.ts adapters are the only route from typed code into frozen src/*.js. They are the surface that has to disappear before legacy can - and legacy stays until it does, because it is the rollback.</text>
  </svg>
