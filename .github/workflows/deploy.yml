name: CI and deploy

on:
  pull_request:
  push:
    branches:
      - main
      # Release snapshots build too, so a hotfix committed on a release branch
      # has an image of its own. Without this the "the image must already
      # exist" guard below would refuse to release any commit that never sat
      # on main -- which is the entire reason to cut a release branch.
      - 'release/**'
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      operation:
        description: Safe manual operation
        required: true
        default: verify-production-db
        type: choice
        options:
          - verify-production-db
          - inspect-production
          - inspect-host-capacity
          - deploy-integration
          - stop-integration
          - inspect-integration
          - release-integration-news
          - run-integration-news
          - clear-integration-excluded-topics

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    # Not on tags. A tag releases an image that already exists, and that image
    # exists only because this gate passed on the commit that built it. Running
    # it again would re-prove the same thing and put six minutes between the
    # tag and production for no added certainty.
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.operation == 'verify-production-db')
      && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_IMAGE: telegram-news-agent:ci
      POSTGRES_PASSWORD: ci-superuser-password
      POSTGRES_APP_PASSWORD: ci-application-password
      POSTGRES_TEST_PORT: "55432"
      DATABASE_TEST_URL: postgresql://telegram_news_app:ci-application-password@127.0.0.1:55432/telegram_news
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Create test-only Compose environment files
        # Compose requires a declared env_file to EXIST before it will resolve a
        # project, even with --no-env-resolution. Both stages need one, and both
        # are empty: these checks assert which file each stage is wired to and
        # never read its contents.
        #
        # .env.production carries a probe key that .env.integration does not.
        # The integration overlay must NOT inherit it -- see the env_file
        # assertion in the next step.
        run: |
          install -m 600 /dev/null .env.production
          printf 'X_PRODUCTION_ONLY=production\n' > .env.production
          chmod 600 .env.production
          install -m 600 /dev/null .env.integration

      - name: Validate deployment configuration
        env:
          POSTGRES_PASSWORD: ci-superuser-password
          POSTGRES_APP_PASSWORD: ci-application-password
          POSTGRES_SSH_TUNNEL_PORT: "55433"
        run: |
          bash -n ops/deploy.sh ops/configure-db-observer.sh ops/notify-deployment.sh \
            ops/deploy-integration.sh
          # The guards that keep the integration stage from starving or
          # overwriting production. Every one is a refusal, and the suite drives
          # each into refusing rather than trusting that it would.
          ./checks/ops/deploy-integration-guards.sh
          docker compose \
            -f compose.yaml \
            -f compose.ssh-access.yaml \
            config --quiet --no-env-resolution
          # Not a deployment path, but it must stay valid: it is how cutover
          # will be performed, and a broken overlay would only be discovered
          # then.
          docker compose \
            -f compose.yaml \
            -f compose.nest.yaml \
            config --quiet --no-env-resolution
          # Same reasoning for the integration stage: a broken overlay would
          # only surface when a deploy tried to use it.
          docker compose \
            -f compose.yaml \
            -f compose.integration.yaml \
            config --quiet --no-env-resolution
          # Compose MERGES env_file lists rather than replacing them, so
          # compose.yaml's `.env.production` leaked into the integration stack
          # until the overlay used `!override` -- production's bot token and
          # channel, loaded first, with integration's file only overriding the
          # keys it happened to set.
          #
          # Asserted through behaviour, not through `config`'s rendering of
          # `env_file`: whether that key appears at all varies by Compose
          # version (the runner omits it, a local install emits it), so an
          # assertion on it fails for the wrong reason. Instead .env.production
          # carries a probe key and the integration stack must not have it.
          probe() {
            docker compose -f compose.yaml -f "$1" config --format json \
              | jq -r '.services.bot.environment.X_PRODUCTION_ONLY // "absent"'
          }
          # Positive control first: if the probe never reaches production
          # either, "absent" below would prove nothing.
          test "$(probe compose.ssh-access.yaml)" = "production" || {
            echo "the env_file probe did not reach production's bot, so this check proves nothing" >&2
            exit 1
          }
          test "$(probe compose.integration.yaml)" = "absent" || {
            echo "integration inherited production's env_file; the overlay needs env_file: !override" >&2
            exit 1
          }
          # The two stages must never resolve to the same compose project, or
          # they would share containers and the postgres volume.
          prod_project="$(docker compose -f compose.yaml -f compose.ssh-access.yaml config --format json | jq -r .name)"
          int_project="$(docker compose -f compose.yaml -f compose.integration.yaml config --format json | jq -r .name)"
          test "$prod_project" != "$int_project" || {
            echo "integration and production resolve to the same compose project: $prod_project" >&2
            exit 1
          }
          # The default must stay legacy. BOT_ENTRYPOINT is the cutover switch,
          # and the reason it is a variable is that deploy.sh restores the
          # environment file on rollback but not compose.yaml -- so a command
          # written literally would survive a rollback and the restored image
          # would start the wrong runtime. Assert both directions so the default
          # cannot be flipped by accident.
          resolved_command() {
            docker compose -f compose.yaml config --format json \
              | jq -r '.services.bot.command | join(" ")'
          }
          test "$(resolved_command)" = "node src/telegram-bot.js" || {
            echo "compose.yaml no longer defaults to the legacy entrypoint: $(resolved_command)" >&2
            exit 1
          }
          test "$(BOT_ENTRYPOINT=dist/composition/runtime-entry.js resolved_command)" \
            = "node dist/composition/runtime-entry.js" || {
            echo "BOT_ENTRYPOINT no longer selects the compiled runtime" >&2
            exit 1
          }

      - name: Run unit tests
        run: npm test

      - name: Validate Drizzle schema snapshot
        run: |
          npm run typecheck
          npm run test:drizzle
          npm run test:drizzle:sources
          npm run test:persistence
          npm run test:application
          npm run test:architecture
          npm run test:runtime
          npm run test:nest:build

      - name: Build test image
        run: docker build --tag "$APP_IMAGE" .

      # The image is the only place the compiled runtime meets production-only
      # dependencies. `test:nest:build` proves dist/ works against the full
      # devDependency tree; this proves it works without one.
      - name: Verify the image ships a runnable compiled runtime
        run: |
          docker run --rm --entrypoint node "$APP_IMAGE" \
            -e "import('/app/dist/composition/runtime-entry.js').then((m) => {
                  if (typeof m.startNewsAgentRuntime !== 'function') {
                    throw new Error('dist/ does not export startNewsAgentRuntime');
                  }
                })"
          # The health probe must fail closed on an unidentifiable runtime. The
          # verdict is asserted, not just the exit code: a probe whose imports
          # cannot resolve against production-only dependencies also exits
          # non-zero, so an exit-code-only check would pass on exactly the
          # failure this step exists to catch. DATABASE_URL is deliberately
          # unreachable -- reaching the identity verdict at all proves the probe
          # returns before it opens a pool.
          probe_output="$(
            docker run --rm --entrypoint node \
              -e DATABASE_URL=postgresql://nobody@127.0.0.1:1/nothing \
              "$APP_IMAGE" dist/composition/health-cli.js 2>&1
          )" && {
            echo "health CLI reported healthy with no configuration" >&2
            exit 1
          }
          # One line, and that line is the verdict. A substring search alone
          # would still pass for a probe that printed the right verdict and
          # then crashed.
          case "$probe_output" in
            '{"event":"runtime_unhealthy","reason":"TELEGRAM_CHANNEL_ID'*'}') ;;
            *)
              echo "health CLI did not fail closed with an identity verdict:" >&2
              echo "$probe_output" >&2
              exit 1
              ;;
          esac
          # Production still runs the legacy entrypoint. Carrying dist/ must not
          # change what the image starts.
          test "$(docker inspect --format '{{json .Config.Cmd}}' "$APP_IMAGE")" \
            = '["node","src/telegram-bot.js"]'

      - name: Run PostgreSQL migration and integration tests
        run: |
          docker compose \
            -p telegram-news-agent-ci \
            -f compose.yaml \
            -f compose.test.yaml \
            up -d db
          docker compose \
            -p telegram-news-agent-ci \
            -f compose.yaml \
            -f compose.test.yaml \
            run --rm migrate
          docker compose \
            -p telegram-news-agent-ci \
            -f compose.yaml \
            -f compose.test.yaml \
            run --rm migrate
          DATABASE_URL="$DATABASE_TEST_URL" \
            npm run database:status -- --require-applied
          DATABASE_URL="$DATABASE_TEST_URL" \
            npm run database:contract -- \
              --output "$RUNNER_TEMP/postgres-contract.json"
          DATABASE_URL="$DATABASE_TEST_URL" npm run database:drift
          npm run test:integration
          DATABASE_TEST_URL="$DATABASE_TEST_URL" npm run test:integration:drizzle

      - name: Upload PostgreSQL contract inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-contract-${{ github.sha }}
          path: ${{ runner.temp }}/postgres-contract.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Show container logs after failure
        if: failure()
        run: |
          docker compose \
            -p telegram-news-agent-ci \
            -f compose.yaml \
            -f compose.test.yaml \
            logs --tail=100 db

      - name: Remove test containers
        if: always()
        run: |
          docker compose \
            -p telegram-news-agent-ci \
            -f compose.yaml \
            -f compose.test.yaml \
            down -v --remove-orphans

  verify-production-db:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'verify-production-db'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    env:
      REMOTE_PROBE_ENV: /tmp/telegram-news-db-credential-probe-${{ github.run_id }}.env
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Install pinned SOPS
        env:
          SOPS_VERSION: 3.13.3
          SOPS_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
        run: |
          install -d -m 700 "$RUNNER_TEMP/bin"
          curl --fail --silent --show-error --location \
            "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64" \
            --output "$RUNNER_TEMP/bin/sops"
          printf '%s  %s\n' "$SOPS_SHA256" "$RUNNER_TEMP/bin/sops" | sha256sum --check
          chmod 755 "$RUNNER_TEMP/bin/sops"
          printf '%s\n' "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Decrypt and validate candidate production environment
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/sops"
          printf '%s\n' "$SOPS_AGE_KEY" > "$RUNNER_TEMP/sops/age-key.txt"
          chmod 600 "$RUNNER_TEMP/sops/age-key.txt"
          install -m 600 /dev/null "$RUNNER_TEMP/production.env"
          SOPS_AGE_KEY_FILE="$RUNNER_TEMP/sops/age-key.txt" \
            sops decrypt \
              --input-type dotenv \
              --output-type dotenv \
              secrets/production.env.sops > "$RUNNER_TEMP/production.env"
          ops/validate-production-env.sh --complete "$RUNNER_TEMP/production.env"

      - name: Verify candidate PostgreSQL credentials on Oracle
        env:
          ORACLE_HOST: ${{ vars.ORACLE_HOST }}
          ORACLE_USER: ${{ vars.ORACLE_USER }}
        run: |
          remote_env="$REMOTE_PROBE_ENV"
          scp "$RUNNER_TEMP/production.env" "${ORACLE_USER}@${ORACLE_HOST}:${remote_env}"
          ssh "${ORACLE_USER}@${ORACLE_HOST}" bash -s -- "$remote_env" <<'REMOTE'
          set -Eeuo pipefail
          candidate_env="$1"
          trap 'rm -f "$candidate_env"' EXIT
          chmod 600 "$candidate_env"
          postgres_password="$(sed -nE 's/^POSTGRES_PASSWORD=//p' "$candidate_env")"
          app_password="$(sed -nE 's/^POSTGRES_APP_PASSWORD=//p' "$candidate_env")"
          test -n "$postgres_password"
          test -n "$app_password"
          cd /opt/telegram-news-agent
          db_container="$(
            docker compose \
              --env-file .env.production \
              -f compose.yaml \
              -f compose.ssh-access.yaml \
              ps -q db
          )"
          test -n "$db_container"
          docker exec -e PGPASSWORD="$postgres_password" "$db_container" \
            psql -h 127.0.0.1 -U postgres -d postgres \
              -v ON_ERROR_STOP=1 -Atqc 'select 1' >/dev/null
          echo "PostgreSQL superuser credential verified."
          docker exec -e PGPASSWORD="$app_password" "$db_container" \
            psql -h 127.0.0.1 -U telegram_news_app -d telegram_news \
              -v ON_ERROR_STOP=1 -Atqc 'select 1' >/dev/null
          echo "PostgreSQL application credential verified."
          REMOTE

      - name: Remove Oracle credential probe plaintext
        if: always()
        env:
          ORACLE_HOST: ${{ vars.ORACLE_HOST }}
          ORACLE_USER: ${{ vars.ORACLE_USER }}
        run: ssh "${ORACLE_USER}@${ORACLE_HOST}" "rm -f -- '$REMOTE_PROBE_ENV'"

      - name: Remove runner credential probe plaintext
        if: always()
        run: rm -rf "$RUNNER_TEMP/production.env" "$RUNNER_TEMP/sops"

  inspect-production:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'inspect-production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$ORACLE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Inspect production bot without changing it
        env:
          ORACLE_HOST: ${{ vars.ORACLE_HOST }}
          ORACLE_USER: ${{ vars.ORACLE_USER }}
        run: |
          ssh "${ORACLE_USER}@${ORACLE_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/telegram-news-agent

          container_id="$(docker ps -q --filter 'name=^/telegram-news-agent-bot-1$')"
          if [[ -z "$container_id" ]]; then
            echo "Production bot container is missing."
            exit 1
          fi

          docker inspect --format \
            'BotState status={{.State.Status}} running={{.State.Running}} restart_count={{.RestartCount}} exit_code={{.State.ExitCode}} oom_killed={{.State.OOMKilled}} started_at={{.State.StartedAt}}' \
            "$container_id"

          docker exec -i "$container_id" node --input-type=module <<'NODE'
          import pg from 'pg';
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          const result = await client.query(`select provider, status, error_code, operation, started_at, completed_at, latency_ms, correlation_id from public.ai_provider_attempts order by started_at desc limit 10`);
          for (const row of result.rows) console.log(`AiProviderAttempt provider=${row.provider} status=${row.status} error_code=${row.error_code ?? 'none'} operation=${row.operation} started_at=${row.started_at?.toISOString?.() ?? row.started_at} completed_at=${row.completed_at?.toISOString?.() ?? row.completed_at} latency_ms=${row.latency_ms ?? 'none'} trace_id=${row.correlation_id}`);
          const settings = await client.query(`select telegram_channel_id, excluded_topic_codes, coalesce(array_length(topic_codes, 1), 0) as topic_count, language_code, approval_policy, schedule_interval_minutes from public.news_bot_settings order by telegram_channel_id`);
          if (!settings.rows.length) console.log("Settings (no rows)");
          for (const r of settings.rows) console.log(`Settings channel=${r.telegram_channel_id} excluded_topic_codes=[${(r.excluded_topic_codes ?? []).join(",")}] topic_count=${r.topic_count} language=${r.language_code} approval=${r.approval_policy} interval_minutes=${r.schedule_interval_minutes ?? "none"}`);
          const perOp = await client.query(`select operation, count(*)::int as n from public.ai_provider_attempts where started_at > now() - interval '24 hours' group by operation order by n desc`);
          if (!perOp.rows.length) console.log("AiCalls24h (none)");
          for (const r of perOp.rows) console.log(`AiCalls24h operation=${r.operation} count=${r.n}`);
          await client.end();
          NODE

          runtime_env_ok=true
          if ! docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$container_id" |
            awk -F= '
              BEGIN {
                split("DATABASE_URL TELEGRAM_BOT_TOKEN TELEGRAM_CHANNEL_ID OPENAI_API_KEY GEMINI_API_KEY EXA_API_KEY NOTION_API_KEY NOTION_AGENT_RUNS_DATA_SOURCE_ID NOTION_PIPELINE_AGENT_PAGE_ID", required, " ")
                for (i in required) state[required[i]] = "missing"
              }
              {
                key = $1
                if (!(key in state)) next
                value = substr($0, length(key) + 2)
                normalized = tolower(value)
                if (value == "") state[key] = "empty"
                else if (normalized ~ /placeholder|change-me|changeme|local-integration/) state[key] = "placeholder"
                else state[key] = "present"
              }
              END {
                failed = 0
                for (i in required) {
                  print "RuntimeEnv " required[i] "=" state[required[i]]
                  if (state[required[i]] != "present") failed = 1
                }
                exit failed
              }
            ' | sort; then
            runtime_env_ok=false
          fi

          telegram_ok=true
          if ! docker exec -i "$container_id" node --input-type=module <<'NODE'
          const token = process.env.TELEGRAM_BOT_TOKEN;
          const channelId = process.env.TELEGRAM_CHANNEL_ID;

          async function telegram(method, body) {
            if (!token) return { ok: false, description: 'token missing' };
            const response = await fetch(`https://api.telegram.org/bot${token}/${method}`, {
              method: body ? 'POST' : 'GET',
              headers: body ? { 'content-type': 'application/json' } : undefined,
              body: body ? JSON.stringify(body) : undefined,
            });
            return response.json();
          }

          try {
            const me = await telegram('getMe');
            console.log(`TelegramProbe getMe_ok=${Boolean(me.ok)} username=${me.ok ? me.result.username : 'unavailable'}`);

            const webhook = await telegram('getWebhookInfo');
            console.log(`TelegramProbe webhook_ok=${Boolean(webhook.ok)} webhook_configured=${Boolean(webhook.ok && webhook.result.url)} pending_updates=${webhook.ok ? webhook.result.pending_update_count : 'unavailable'} last_error_present=${Boolean(webhook.ok && webhook.result.last_error_message)}`);

              const chat = channelId ? await telegram('getChat', { chat_id: channelId }) : { ok: false };
              console.log(`TelegramProbe channel_ok=${Boolean(chat.ok)} channel_type=${chat.ok ? chat.result.type : 'unavailable'}`);
              if (!me.ok || !webhook.ok || Boolean(webhook.result.url) || !chat.ok) process.exitCode = 1;
            } catch (error) {
            console.log(`TelegramProbe network_ok=false error_type=${error?.name || 'Error'}`);
            process.exitCode = 1;
            }
          NODE
          then
            telegram_ok=false
          fi

          echo "BotLogSummary"
          docker logs --tail=300 "$container_id" 2>&1 |
            sed -E \
              -e 's#[0-9]{8,}:[A-Za-z0-9_-]{20,}#[REDACTED_TELEGRAM_TOKEN]#g' \
              -e 's#(sk|exa)[-_][A-Za-z0-9_-]{16,}#[REDACTED_API_KEY]#g' \
              -e 's#postgres(ql)?://[^/@:]+:[^/@]+@#postgresql://[REDACTED]@#g' |
            grep -Ei 'error|failed|fatal|warn|poll|telegram|unauthorized|forbidden|conflict|invalid|started|ready|scheduler' |
            tail -n 120 || true

          if [[ "$runtime_env_ok" != "true" || "$telegram_ok" != "true" ]]; then
            echo "Production runtime inspection failed."
            exit 1
          fi
          REMOTE

  # Read-only. Reports what the host has, so the integration stage's footprint
  # is a measurement rather than a guess, and so a refused deploy can be
  # explained without an ad-hoc SSH session.
  # Read-only view into the integration stage: what /news did, what the
  # providers were asked, and what the bot's memory is doing under it. Reaches
  # the database the same way inspect-production does -- `docker exec` inside
  # the stage's own bot container, using that container's DATABASE_URL, so no
  # credential is copied anywhere.
  inspect-integration:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'inspect-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Inspect the integration stage
        env:
          ORACLE_HOST: ${{ vars.ORACLE_HOST }}
          ORACLE_USER: ${{ vars.ORACLE_USER }}
        run: |
          ssh "${ORACLE_USER}@${ORACLE_HOST}" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          container_id="$(docker ps -q --filter 'name=^/telegram-news-agent-int-bot-1$')"
          if [[ -z "$container_id" ]]; then
            echo "Integration bot container is not running." >&2
            docker ps -a --filter 'name=telegram-news-agent-int' --format 'table {{.Names}}\t{{.Status}}' >&2
            exit 1
          fi

          echo "=== container ==="
          docker inspect --format \
            'IntegrationBot status={{.State.Status}} running={{.State.Running}} restart_count={{.RestartCount}} exit_code={{.State.ExitCode}} oom_killed={{.State.OOMKilled}} mem_limit={{.HostConfig.Memory}} started_at={{.State.StartedAt}}' \
            "$container_id"
          docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.MemPerc}}\t{{.CPUPerc}}' \
            $(docker ps -q --filter 'name=telegram-news-agent') || true
          awk '/^(MemAvailable|SwapFree):/ { printf "  %-14s %8.0f MiB\n", $1, $2/1024 }' /proc/meminfo

          echo
          echo "=== /news jobs ==="
          docker exec -i "$container_id" node --input-type=module <<'NODE'
          import pg from "pg";
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          const jobs = await client.query(
            `select id, status, outcome_status, error_code, draft_id, claimed_at,
                    publication_message_id, execution_attempt_count, delivery_attempt_count,
                    available_at, created_at, updated_at, completed_at
               from public.telegram_news_jobs order by created_at desc limit 5`);
          if (jobs.rows.length === 0) console.log("NewsJob (none)");
          for (const r of jobs.rows) {
            console.log(`NewsJob status=${r.status} outcome=${r.outcome_status ?? "none"} error=${r.error_code ?? "none"} draft=${r.draft_id ?? "none"} msg=${r.publication_message_id ?? "none"} exec_attempts=${r.execution_attempt_count} deliver_attempts=${r.delivery_attempt_count} claimed=${r.claimed_at?.toISOString?.() ?? "never"} created=${r.created_at?.toISOString?.() ?? r.created_at} updated=${r.updated_at?.toISOString?.() ?? r.updated_at} completed=${r.completed_at?.toISOString?.() ?? "none"}`);
          }
          const cp = await client.query(
            `select update_id, status, draft_id, window_hours, publication_message_id, updated_at
               from public.telegram_news_request_checkpoints order by updated_at desc limit 3`);
          for (const r of cp.rows) {
            console.log(`Checkpoint update=${r.update_id} status=${r.status} draft=${r.draft_id ?? "none"} window=${r.window_hours ?? "none"} msg=${r.publication_message_id ?? "none"} updated=${r.updated_at?.toISOString?.() ?? r.updated_at}`);
          }
          const drafts = await client.query(
            `select id, status, created_at from public.drafts order by created_at desc limit 3`);
          for (const r of drafts.rows) {
            console.log(`Draft id=${r.id} status=${r.status} created=${r.created_at?.toISOString?.() ?? r.created_at}`);
          }
          await client.end();
          NODE

          echo
          echo "=== AI provider activity ==="
          docker exec -i "$container_id" node --input-type=module <<'NODE'
          import pg from "pg";
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          const settings = await client.query(`select telegram_channel_id, excluded_topic_codes, coalesce(array_length(topic_codes, 1), 0) as topic_count, language_code, approval_policy, schedule_interval_minutes from public.news_bot_settings order by telegram_channel_id`);
          if (!settings.rows.length) console.log("Settings (no rows)");
          for (const r of settings.rows) console.log(`Settings channel=${r.telegram_channel_id} excluded_topic_codes=[${(r.excluded_topic_codes ?? []).join(",")}] topic_count=${r.topic_count} language=${r.language_code} approval=${r.approval_policy} interval_minutes=${r.schedule_interval_minutes ?? "none"}`);
          const perOp = await client.query(`select operation, count(*)::int as n from public.ai_provider_attempts where started_at > now() - interval '24 hours' group by operation order by n desc`);
          if (!perOp.rows.length) console.log("AiCalls24h (none)");
          for (const r of perOp.rows) console.log(`AiCalls24h operation=${r.operation} count=${r.n}`);
          // Feature flags, because their absence has already been mistaken for a
          // bug once: editorial enrichment was off on this stage while it was
          // on in production, and nothing in the inspection said so.
          // Why an article came out the length it did. The enrichment
          // diagnostic and the body length answer that directly; without them
          // the only honest answer is a guess about a text nobody can see.
          const drafts = await client.query(
            `select id, status, length(body) as body_chars, reviewer_notes, created_at
               from public.drafts order by created_at desc limit 3`);
          for (const r of drafts.rows) {
            let enrichment = "unparsed";
            try {
              const notes = JSON.parse(r.reviewer_notes ?? "{}");
              const e = notes.editorial_enrichment;
              // `diagnostic` is the whole point of this line.
              //
              // Enrichment reported fallback_to_baseline on four consecutive
              // runs and the reason was recorded every time -- in a field
              // nothing printed. "It fell back" is not a finding; it is the
              // observation that hides one. The field distinguishes a missing
              // provider from a thrown enrichment from an enriched draft the
              // validator refused, and those have nothing in common.
              enrichment = e
                ? `state=${e.state} status=${e.status} selected=${e.selected_version} diagnostic=${e.diagnostic ?? "none"} evidence_map=${(e.evidence_map ?? []).length} searches=${e.search?.attempts ?? "n/a"} enriched_words=${e.quality?.word_count ?? "n/a"} target=${e.quality?.target_min_words ?? "?"}-${e.quality?.target_max_words ?? "?"}`
                : "absent";
            } catch { enrichment = "unparsed"; }
            console.log(`DraftDetail id=${r.id} status=${r.status} body_chars=${r.body_chars} ${enrichment} created=${r.created_at?.toISOString?.() ?? r.created_at}`);
          }

          // The article itself, and the sources it actually rests on.
          //
          // `body_chars` says how long it is and nothing about whether the
          // retrieved details reached it. Answering "did the search help?"
          // from the stage meant reading a number and guessing.
          const article = await client.query(
            `select id, body, reviewer_notes from public.drafts
              order by created_at desc limit 1`);
          for (const r of article.rows) {
            let notes = {};
            try { notes = JSON.parse(r.reviewer_notes ?? "{}"); } catch {}
            const e = notes.editorial_enrichment ?? {};
            const map = e.evidence_map ?? [];
            const mapped = [...new Set(map.map((m) => m.sourceUrl).filter(Boolean))];
            const claimed = [...new Set((notes.claims ?? []).map((c) => c.sourceUrl).filter(Boolean))];
            console.log(`ArticleSources draft=${r.id} claim_urls=${JSON.stringify(claimed)} evidence_map_urls=${JSON.stringify(mapped)} map_entries=${map.length} reader_angle=${JSON.stringify(e.reader_angle ?? null)} similarity=${JSON.stringify(e.similarity ?? null)} attempts=${e.attempts ?? "n/a"}`);
            for (const line of String(r.body ?? "").split("\n")) {
              console.log(`ArticleBody | ${line}`);
            }
          }

          // Which retrieval path actually produced the article text.
          //
          // Added because a live run showed `searchFact provider=exa` in the
          // ledger and nothing whatsoever for content retrieval, so "did the
          // full-article path work?" could not be answered from the stage at
          // all. Both paths used to write the same extractor, which made the
          // stored text silent about its own origin.
          const contents = await client.query(
            `select extractor, metadata->>'retrieved_by' as retrieved_by,
                    length(content) as chars, metadata->>'source_url' as source_url,
                    created_at
               from public.raw_contents order by created_at desc limit 5`);
          if (!contents.rows.length) console.log("ArticleContent (none)");
          for (const r of contents.rows) {
            console.log(`ArticleContent retrieved_by=${r.retrieved_by ?? "unrecorded"} extractor=${r.extractor ?? "none"} chars=${r.chars} url=${r.source_url ?? "none"} created=${r.created_at?.toISOString?.() ?? r.created_at}`);
          }

          const flags = await client.query(
            `select telegram_channel_id, feature_key, state, version, updated_at
               from public.news_feature_flags
              order by telegram_channel_id, feature_key`);
          if (!flags.rows.length) console.log("FeatureFlag (none configured — every feature is off)");
          for (const r of flags.rows) {
            console.log(`FeatureFlag channel=${r.telegram_channel_id} ${r.feature_key}=${r.state} version=${r.version} updated=${r.updated_at?.toISOString?.() ?? r.updated_at}`);
          }
          const byOp = await client.query(
            `select operation, provider, status, count(*)::int as n,
                    round(avg(latency_ms))::int as avg_ms, max(started_at) as last_at
               from public.ai_provider_attempts
              where started_at > now() - interval '24 hours'
              group by operation, provider, status
              order by n desc limit 20`);
          for (const r of byOp.rows) {
            console.log(`AiByOperation operation=${r.operation} provider=${r.provider} status=${r.status} count=${r.n} avg_latency_ms=${r.avg_ms ?? "n/a"} last=${r.last_at?.toISOString?.() ?? r.last_at}`);
          }
          if (!byOp.rows.length) console.log("AiByOperation (nothing in the last 24 hours)");
          const agg = await client.query(
            `select provider, status, error_code, count(*)::int as n,
                    round(avg(latency_ms))::int as avg_ms, max(started_at) as last_at
               from public.ai_provider_attempts
              group by provider, status, error_code
              order by n desc limit 15`);
          if (agg.rows.length === 0) console.log("AiAttempts (none)");
          for (const r of agg.rows) {
            console.log(`AiAttempts provider=${r.provider} status=${r.status} error=${r.error_code ?? "none"} count=${r.n} avg_latency_ms=${r.avg_ms ?? "n/a"} last=${r.last_at?.toISOString?.() ?? r.last_at}`);
          }
          const total = await client.query(`select count(*)::int as n from public.ai_provider_attempts`);
          const usage = await client.query(`select count(*)::int as n from public.ai_usage_events`);
          console.log(`AiTotals attempts=${total.rows[0].n} usage_events=${usage.rows[0].n}`);
          await client.end();
          NODE

          echo
          echo "=== isolation ==="
          # The volume is the boundary. Shown rather than asserted, because
          # "integration cannot touch production's data" is the claim the whole
          # stage rests on.
          docker volume ls --format '{{.Name}}' | grep -E 'telegram-news-agent' | sed 's/^/  volume: /'
          for p in telegram-news-agent telegram-news-agent-int; do
            printf '  project %-26s containers: %s\n' "$p" \
              "$(docker ps --filter "label=com.docker.compose.project=$p" --format '{{.Names}}' | tr '\n' ' ')"
          done

          echo
          echo "=== research inputs (why a run can find nothing) ==="
          docker exec -i "$container_id" node --input-type=module <<'NODE'
          import pg from "pg";
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          const q = async (label, sql) => {
            try {
              const { rows } = await client.query(sql);
              for (const r of rows) console.log(`${label} ${Object.entries(r).map(([k, v]) => `${k}=${v}`).join(" ")}`);
              if (!rows.length) console.log(`${label} (none)`);
            } catch (error) {
              console.log(`${label} unavailable: ${error.message}`);
            }
          };
          await q("Sources", `select count(*)::int as total,
              count(*) filter (where enabled)::int as enabled,
              count(*) filter (where feed_url is not null)::int as with_feed,
              count(*) filter (where enabled and coalesce(consecutive_failures,0) = 0)::int as healthy
            from public.sources`);
          await q("SourceSample", `select name, enabled, coalesce(consecutive_failures,0) as failures
            from public.sources where enabled order by reliability_score desc nulls last limit 5`);
          await q("Articles", `select count(*)::int as total,
              count(*) filter (where created_at > now() - interval '48 hours')::int as last_48h
            from public.articles`);
          await q("Drafts", `select count(*)::int as total from public.drafts`);
          await client.end();
          NODE

          echo
          echo "=== provider credentials ==="
          # Asks each provider whether it accepts the key, and reports only the
          # HTTP status and error type. No key material is read, printed or
          # copied -- the request is made from inside the container using the
          # variable it already holds.
          #
          # This exists because "authentication_failed" in the attempts table
          # says a key was rejected but not why: a malformed key, a revoked
          # one, and an exhausted account are three different fixes and only
          # the provider can tell them apart.
          docker exec -i "$container_id" node --input-type=module <<'NODE'
          const probes = [
            ["openai", "https://api.openai.com/v1/models", { Authorization: `Bearer ${process.env.OPENAI_API_KEY ?? ""}` }],
            ["gemini", `https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(process.env.GEMINI_API_KEY ?? "")}`, {}],
          ];
          for (const [name, url, headers] of probes) {
            const key = name === "openai" ? process.env.OPENAI_API_KEY : process.env.GEMINI_API_KEY;
            if (!key) { console.log(`Credential provider=${name} configured=false`); continue; }
            // Shape only: length and whether the value carries stray whitespace,
            // which is the most common way a pasted key stops working.
            const trimmed = key.trim();
            const shape = `len=${key.length} trimmed_len=${trimmed.length} has_whitespace=${key !== trimmed}`;
            try {
              const res = await fetch(url, { headers });
              let detail = "";
              if (!res.ok) {
                const body = await res.text();
                const parsed = (() => { try { return JSON.parse(body); } catch { return null; } })();
                detail = ` error_type=${parsed?.error?.type ?? parsed?.error?.status ?? "unknown"} error_code=${parsed?.error?.code ?? "none"}`;
              }
              console.log(`Credential provider=${name} configured=true ${shape} http=${res.status} ok=${res.ok}${detail}`);
            } catch (error) {
              console.log(`Credential provider=${name} configured=true ${shape} network_error=${error?.name ?? "Error"}`);
            }
          }
          NODE

          echo
          echo "=== recent bot log ==="
          docker logs --tail=60 "$container_id" 2>&1 | tail -60
          REMOTE

  # Frees a /news job whose worker died mid-research.
  #
  # A claim is honoured for the full stale window -- fifteen minutes on this
  # stage -- and while it stands, every /news on that channel is suppressed as
  # already-running. That is correct when a worker is genuinely still working,
  # and useless when the container holding the claim was replaced by a deploy,
  # which on a stage that is redeployed while testing is the common case.
  #
  # This does not invent a new state transition: it ages the claim so the
  # existing reclaim path picks the job up on the worker's next poll. The job
  # keeps its attempt counts and its settings snapshot, so the retry budget
  # still applies and a genuinely failing job cannot be reset forever.
  release-integration-news:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'release-integration-news'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Release stuck integration news jobs
        env:
          ORACLE_HOST: ${{ vars.ORACLE_HOST }}
          ORACLE_USER: ${{ vars.ORACLE_USER }}
        run: |
          ssh "${ORACLE_USER}@${ORACLE_HOST}" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          container_id="$(docker ps -q --filter 'name=^/telegram-news-agent-int-bot-1$')"
          test -n "$container_id" || { echo "integration bot is not running" >&2; exit 1; }
          docker exec -i "$container_id" node --input-type=module <<'NODE'
          import pg from "pg";
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          // Only jobs whose claim is held by a process that is no longer
          // heartbeating. A claim renewed within the last two minutes belongs
          // to a live worker and is left alone -- releasing that would put two
          // research passes on the same job, which is exactly what the claim
          // exists to prevent.
          const { rows } = await client.query(
            `update public.telegram_news_jobs
                set claimed_at = now() - interval '1 hour',
                    available_at = now()
              where status in ('processing', 'delivering')
                and claimed_at is not null
                and claimed_at < now() - interval '2 minutes'
              returning id, status, telegram_channel_id, execution_attempt_count, claimed_at`);
          if (rows.length === 0) {
            console.log("ReleaseNewsJob nothing to release (no claim older than 2 minutes)");
          }
          for (const r of rows) {
            console.log(`ReleaseNewsJob released id=${r.id} status=${r.status} channel=${r.telegram_channel_id} exec_attempts=${r.execution_attempt_count}`);
          }
          await client.end();
          NODE
          echo "The worker reclaims on its next poll (2s). /news is usable again."
          REMOTE


  # Enqueues a /news run on the integration stage without anyone typing /news.
  #
  # Every article on this stage until now needed a person in Telegram, which
  # made the loop "change the prompt, ask the owner to run it, wait" -- and
  # three of those rounds were spent on a path that turned out never to
  # execute. A change nobody can trigger is a change nobody can verify.
  #
  # Integration only, by explicit container name, exactly like the operations
  # beside it. It cannot reach production's bot even by mistake.
  run-integration-news:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'run-integration-news'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Enqueue a news run on the integration stage
        env:
          ORACLE_HOST: ${{ vars.ORACLE_HOST }}
          ORACLE_USER: ${{ vars.ORACLE_USER }}
        run: |
          ssh "${ORACLE_USER}@${ORACLE_HOST}" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          container_id="$(docker ps -q --filter 'name=^/telegram-news-agent-int-bot-1$')"
          test -n "$container_id" || { echo "integration bot is not running" >&2; exit 1; }
          docker exec -i "$container_id" node --input-type=module <<'NODE'
          import pg from "pg";
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();

          // Refuse while a run is in flight. Two research passes on one
          // channel is what the enqueue's own suppression exists to prevent,
          // and finding out by reading a suppressed job afterwards wastes the
          // trip.
          const live = await client.query(
            `select id, status from public.telegram_news_jobs
              where status in ('queued', 'processing', 'delivering') limit 1`);
          if (live.rows.length) {
            console.log(`RunNews refused: ${live.rows[0].id} is already ${live.rows[0].status}`);
            await client.end();
            process.exit(1);
          }

          // The channel, chat, actor and settings snapshot are copied from the
          // last real /news rather than rebuilt here. The snapshot's shape is
          // the pipeline's contract, and a hand-assembled one would be a
          // second copy of it that can drift.
          const { rows: last } = await client.query(
            `select telegram_channel_id, control_chat_id, requested_by, settings_snapshot
               from public.telegram_news_jobs order by created_at desc limit 1`);
          if (!last.length) {
            console.log("RunNews refused: no previous job to copy channel and settings from");
            await client.end();
            process.exit(1);
          }
          const seed = last[0];

          const { rows: maxUpdate } = await client.query(
            "select coalesce(max(update_id), 2100000000) as m from public.telegram_updates");
          const updateId = Number(maxUpdate[0].m) + 1;

          const { rows: claim } = await client.query(
            "select * from public.claim_telegram_update($1, $2, $3)",
            [updateId, "message", 120]);
          const claimToken = claim[0]?.claim_token;
          if (!claimToken) {
            console.log(`RunNews refused: update ${updateId} was not claimable`);
            await client.end();
            process.exit(1);
          }

          const { rows: job } = await client.query(
            "select * from public.enqueue_telegram_news_job($1, $2, $3, $4, $5, $6)",
            [updateId, claimToken, seed.telegram_channel_id, seed.control_chat_id,
             seed.requested_by, seed.settings_snapshot]);
          console.log(`RunNews enqueued id=${job[0]?.id} outcome=${job[0]?.enqueue_outcome} status=${job[0]?.job_status} update=${updateId} channel=${seed.telegram_channel_id}`);
          await client.end();
          NODE
          echo "The worker claims it on its next poll (2s). Inspect with operation=inspect-integration."
          REMOTE


  clear-integration-excluded-topics:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'clear-integration-excluded-topics'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      # Integration only. The container filter names the integration bot
      # explicitly, so this cannot reach production's settings even if it is
      # dispatched by mistake -- and production already has an empty list.
      - name: Clear the integration channel's excluded topics
        env:
          ORACLE_HOST: ${{ vars.ORACLE_HOST }}
          ORACLE_USER: ${{ vars.ORACLE_USER }}
        run: |
          ssh "${ORACLE_USER}@${ORACLE_HOST}" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          container_id="$(docker ps -q --filter 'name=^/telegram-news-agent-int-bot-1$')"
          test -n "$container_id" || { echo "integration bot is not running" >&2; exit 1; }
          docker exec -i "$container_id" node --input-type=module <<'NODE'
          import pg from "pg";
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          const { rows } = await client.query(
            `select telegram_channel_id, excluded_topic_codes, version, updated_by
               from public.news_bot_settings order by telegram_channel_id`);
          if (rows.length === 0) console.log("ExcludedTopics (no settings rows)");
          for (const row of rows) {
            if ((row.excluded_topic_codes ?? []).length === 0) {
              console.log(`ExcludedTopics channel=${row.telegram_channel_id} already empty; nothing to do`);
              continue;
            }
            // Through the settings function, not a raw UPDATE: it validates the
            // codes, bumps the optimistic version, and is the same path the
            // Telegram settings menu uses. A raw write would skip all three.
            const updated = await client.query(
              `select excluded_topic_codes, version
                 from public.update_news_excluded_topics($1, $2::text[], $3, $4)`,
              [row.telegram_channel_id, [], row.updated_by, row.version]);
            if (updated.rows.length === 0) {
              console.error(`ExcludedTopics channel=${row.telegram_channel_id} REFUSED (version moved under us)`);
              process.exitCode = 1;
              continue;
            }
            const after = updated.rows[0];
            console.log(`ExcludedTopics channel=${row.telegram_channel_id} was=[${(row.excluded_topic_codes ?? []).join(",")}] now=[${(after.excluded_topic_codes ?? []).join(",")}] version=${row.version}->${after.version}`);
          }
          await client.end();
          NODE
          REMOTE


  inspect-host-capacity:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'inspect-host-capacity'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Report host capacity
        env:
          ORACLE_HOST: ${{ vars.ORACLE_HOST }}
          ORACLE_USER: ${{ vars.ORACLE_USER }}
        run: |
          ssh "${ORACLE_USER}@${ORACLE_HOST}" bash -s <<'REMOTE'
          set -Eeuo pipefail
          echo "=== memory ==="
          awk '/^(MemTotal|MemFree|MemAvailable|SwapTotal|SwapFree):/ { printf "%-14s %8.0f MiB\n", $1, $2/1024 }' /proc/meminfo
          echo
          echo "=== per-container ==="
          docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.MemPerc}}' || true
          echo
          echo "=== configured ceilings ==="
          docker ps -q | while read -r id; do
            docker inspect --format '{{.Name}} limit={{.HostConfig.Memory}}B' "$id"
          done
          echo
          echo "=== disk ==="
          df -h / /var/lib/docker 2>/dev/null | sort -u
          echo
          echo "=== verdict ==="
          available="$(awk '/^MemAvailable:/ { print int($2 / 1024); exit }' /proc/meminfo)"
          # 352MiB integration stack (db 128 + bot 224) + 96MiB headroom,
          # matching ops/deploy-integration.sh. Reported, never enforced here --
          # the deploy script is what refuses.
          required=448
          # When the stage is already up, its own footprint is counted as
          # unavailable, so a bare comparison would report "too-small" for a
          # host that is comfortably running it. Add back what it holds, exactly
          # as the deploy script does.
          held=0
          for id in $(docker ps -q --filter 'name=^telegram-news-agent-int-'); do
            bytes="$(docker inspect --format '{{.HostConfig.Memory}}' "$id" 2>/dev/null || echo 0)"
            held=$(( held + bytes / 1024 / 1024 ))
          done
          budget=$(( available + held ))
          if (( budget >= required )); then
            echo "HostCapacity available=${available}MiB integration_held=${held}MiB budget=${budget}MiB required=${required}MiB verdict=fits"
          else
            echo "HostCapacity available=${available}MiB integration_held=${held}MiB budget=${budget}MiB required=${required}MiB verdict=too-small"
          fi
          REMOTE

  # The integration stage. Manual only: it deploys whatever ref it was
  # dispatched on, which is the point -- it is where a change is tried before
  # main. It never touches production's directory, project, volume or
  # environment file, and ops/deploy-integration.sh refuses if the host cannot
  # take it.
  deploy-integration:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select immutable image name
        id: image
        run: echo "value=${IMAGE_NAME}:int-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: |
            linux/amd64
            linux/arm64
          push: true
          # Deliberately not tagged `latest`: an integration build must never
          # become the image a production deploy would pick up.
          tags: ${{ steps.image.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Install pinned SOPS
        env:
          SOPS_VERSION: 3.13.3
          SOPS_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
        run: |
          install -d -m 700 "$RUNNER_TEMP/bin"
          curl --fail --silent --show-error --location \
            "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64" \
            --output "$RUNNER_TEMP/bin/sops"
          printf '%s  %s\n' "$SOPS_SHA256" "$RUNNER_TEMP/bin/sops" | sha256sum --check
          chmod 755 "$RUNNER_TEMP/bin/sops"
          printf '%s\n' "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Decrypt integration environment
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          test -n "$SOPS_AGE_KEY"
          install -d -m 700 "$RUNNER_TEMP/sops"
          printf '%s\n' "$SOPS_AGE_KEY" > "$RUNNER_TEMP/sops/age-key.txt"
          chmod 600 "$RUNNER_TEMP/sops/age-key.txt"
          install -m 600 /dev/null "$RUNNER_TEMP/integration.env"
          SOPS_AGE_KEY_FILE="$RUNNER_TEMP/sops/age-key.txt" \
            sops decrypt \
              --input-type dotenv \
              --output-type dotenv \
              secrets/integration.env.sops > "$RUNNER_TEMP/integration.env"
          # Refuses a file that is missing DEPLOY_STAGE or carries production's.
          # This is what stops production's secrets being deployed here by a
          # mistaken edit to the encrypted file.
          EXPECTED_DEPLOY_STAGE=integration \
            ops/validate-production-env.sh --complete "$RUNNER_TEMP/integration.env"

      - name: Report shared AI provider keys
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          # Two stages polling one bot token is a Telegram 409 and a lease
          # fight; two stages publishing to one channel puts test articles in
          # front of real readers. Neither is recoverable by a rollback, so
          # both are checked before anything is shipped.
          install -m 600 /dev/null "$RUNNER_TEMP/production.env"
          SOPS_AGE_KEY_FILE="$RUNNER_TEMP/sops/age-key.txt" \
            sops decrypt --input-type dotenv --output-type dotenv \
              secrets/production.env.sops > "$RUNNER_TEMP/production.env"
          for key in TELEGRAM_BOT_TOKEN TELEGRAM_CHANNEL_ID; do
            prod="$(sed -nE "s/^${key}=//p" "$RUNNER_TEMP/production.env" | head -1)"
            intg="$(sed -nE "s/^${key}=//p" "$RUNNER_TEMP/integration.env" | head -1)"
            if [[ -z "$intg" ]]; then
              echo "${key} is empty in the integration environment" >&2
              exit 1
            fi
            if [[ "$prod" == "$intg" ]]; then
              echo "${key} is identical in production and integration; refusing to deploy" >&2
              exit 1
            fi
          done
          echo "Integration uses a distinct bot and channel."

          # AI provider keys are a warning, not a refusal. A shared key is a
          # cost and quota hazard rather than a safety one -- integration
          # testing spends production's allowance, which has already happened
          # once here: a single /news made 261 classification calls and
          # exhausted the OpenAI quota. It is not grounds to block a deploy,
          # and making it one would strand the stage until every key is
          # rotated.
          shared=0
          for key in OPENAI_API_KEY GEMINI_API_KEY EXA_API_KEY; do
            prod="$(sed -nE "s/^${key}=//p" "$RUNNER_TEMP/production.env" | head -1)"
            intg="$(sed -nE "s/^${key}=//p" "$RUNNER_TEMP/integration.env" | head -1)"
            [[ -z "$prod" || -z "$intg" ]] && continue
            if [[ "$prod" == "$intg" ]]; then
              echo "::warning::${key} is shared with production; integration testing will spend production's quota"
              shared=$((shared + 1))
            else
              echo "${key} is distinct from production's."
            fi
          done
          if (( shared > 0 )); then
            echo "::notice::${shared} AI provider key(s) shared with production. Set separate values in secrets/integration.env.sops to isolate spend."
          fi
          rm -f "$RUNNER_TEMP/production.env"

      - name: Upload integration bundle
        env:
          ORACLE_HOST: ${{ vars.ORACLE_HOST }}
          ORACLE_USER: ${{ vars.ORACLE_USER }}
        run: |
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_USER"
          umask 077
          install -d -m 700 deployment-int/ops/postgres/init
          install -d -m 700 deployment-int/checks/ops
          install -m 644 compose.yaml deployment-int/compose.yaml
          install -m 644 compose.integration.yaml deployment-int/compose.integration.yaml
          install -m 755 ops/deploy-integration.sh deployment-int/ops/deploy-integration.sh
          install -m 755 ops/validate-production-env.sh deployment-int/ops/validate-production-env.sh
          install -m 755 ops/postgres/init/00-create-app-role.sh deployment-int/ops/postgres/init/00-create-app-role.sh
          install -m 644 package.json deployment-int/package.json
          install -m 600 "$RUNNER_TEMP/integration.env" deployment-int/.env.integration
          # compose.ssh-access.yaml is deliberately NOT shipped: production's
          # tunnel port is in it, and integration binds its own via the
          # overlay. Shipping it here would put two services on one port.
          tar -C deployment-int -czf deployment-int.tar.gz .
          chmod 600 deployment-int.tar.gz
          remote_archive="/tmp/telegram-news-agent-int-${GITHUB_SHA}.tar.gz"
          scp deployment-int.tar.gz "${ORACLE_USER}@${ORACLE_HOST}:${remote_archive}"
          ssh "${ORACLE_USER}@${ORACLE_HOST}" bash -s -- "$remote_archive" <<'REMOTE'
          set -Eeuo pipefail
          archive="$1"
          trap 'rm -f "$archive"' EXIT
          chmod 600 "$archive"
          # A separate directory from production's, so the two stacks can never
          # share a compose file or an environment file.
          #
          # /opt is root-owned, so the first deploy has to create this once with
          # sudo and hand it to the deploy user. Production's directory was made
          # the same way during its initial setup; every later deploy just
          # writes into a directory it already owns. `sudo -n` so a host without
          # passwordless sudo fails with this message instead of hanging on a
          # password prompt no one is there to type.
          dir=/opt/telegram-news-agent-int
          if [[ ! -d "$dir" ]]; then
            if ! sudo -n install -d -m 750 -o "$(id -un)" -g "$(id -gn)" "$dir"; then
              echo "cannot create $dir: it does not exist and passwordless sudo is unavailable" >&2
              echo "create it once by hand: sudo install -d -m 750 -o $(id -un) -g $(id -gn) $dir" >&2
              exit 1
            fi
            echo "Created $dir (first deploy)."
          fi
          test -w "$dir" || { echo "$dir is not writable by $(id -un)" >&2; exit 1; }
          tar -xzf "$archive" -C "$dir"
          REMOTE

      - name: Preflight the host
        env:
          ORACLE_HOST: ${{ vars.ORACLE_HOST }}
          ORACLE_USER: ${{ vars.ORACLE_USER }}
        run: |
          # Runs every guard and starts nothing, so a host that cannot take the
          # stage is reported before an image is pulled onto it.
          ssh "${ORACLE_USER}@${ORACLE_HOST}" \
            /opt/telegram-news-agent-int/ops/deploy-integration.sh --check-only

      - name: Log Oracle host in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORACLE_HOST: ${{ vars.ORACLE_HOST }}
          ORACLE_USER: ${{ vars.ORACLE_USER }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh "${ORACLE_USER}@${ORACLE_HOST}" \
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Deploy integration stage
        env:
          DEPLOY_IMAGE: ${{ steps.image.outputs.value }}
          ORACLE_HOST: ${{ vars.ORACLE_HOST }}
          ORACLE_USER: ${{ vars.ORACLE_USER }}
        run: |
          # shellcheck disable=SC2029
          ssh "${ORACLE_USER}@${ORACLE_HOST}" \
            /opt/telegram-news-agent-int/ops/deploy-integration.sh "$DEPLOY_IMAGE"

      - name: Confirm production was untouched
        if: always()
        env:
          ORACLE_HOST: ${{ vars.ORACLE_HOST }}
          ORACLE_USER: ${{ vars.ORACLE_USER }}
        run: |
          # The claim this whole job rests on, checked rather than asserted --
          # and checked even when the deploy failed, because a failed deploy
          # that disturbed production is the outcome that matters most.
          ssh "${ORACLE_USER}@${ORACLE_HOST}" bash -s <<'REMOTE'
          set -Eeuo pipefail
          container="$(docker ps -a --filter 'name=^telegram-news-agent-bot' --format '{{.Names}}' | head -1)"
          if [[ -z "$container" ]]; then
            echo "production bot container is missing" >&2
            exit 1
          fi
          docker inspect --format \
            'ProductionBot name={{.Name}} running={{.State.Running}} restart_count={{.RestartCount}} oom_killed={{.State.OOMKilled}} started_at={{.State.StartedAt}}' \
            "$container"
          running="$(docker inspect --format '{{.State.Running}}' "$container")"
          oom="$(docker inspect --format '{{.State.OOMKilled}}' "$container")"
          test "$running" = "true" || { echo "production bot is not running" >&2; exit 1; }
          test "$oom" = "false" || { echo "production bot was OOM killed" >&2; exit 1; }
          REMOTE

      - name: Log Oracle host out of GHCR
        if: always()
        env:
          ORACLE_HOST: ${{ vars.ORACLE_HOST }}
          ORACLE_USER: ${{ vars.ORACLE_USER }}
        run: ssh "${ORACLE_USER}@${ORACLE_HOST}" 'docker logout ghcr.io' || true

      - name: Remove runner plaintext
        if: always()
        run: |
          rm -rf \
            "$RUNNER_TEMP/integration.env" \
            "$RUNNER_TEMP/production.env" \
            "$RUNNER_TEMP/sops" \
            deployment-int \
            deployment-int.tar.gz

  # Tears the integration stage down and gives the host its memory back. The
  # box is a 952MiB instance, so this stage is brought up to test and stopped
  # after rather than left running. The volume is deliberately KEPT: `down`
  # without `-v` leaves PGDATA in place, so the next deploy resumes with its
  # data and its applied migrations instead of re-migrating from empty.
  stop-integration:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'stop-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Stop the integration stage
        env:
          ORACLE_HOST: ${{ vars.ORACLE_HOST }}
          ORACLE_USER: ${{ vars.ORACLE_USER }}
        run: |
          ssh "${ORACLE_USER}@${ORACLE_HOST}" bash -s <<'REMOTE'
          set -Eeuo pipefail
          dir=/opt/telegram-news-agent-int
          if [[ ! -d "$dir" ]]; then
            echo "Integration stage is not installed; nothing to stop."
            exit 0
          fi
          cd "$dir"
          # --project-name is passed explicitly and the compose files are the
          # integration pair, so this cannot reach production's stack. No -v:
          # the volume stays.
          docker compose \
            --project-name telegram-news-agent-int \
            --env-file .env.integration \
            -f compose.yaml \
            -f compose.integration.yaml \
            down --remove-orphans
          echo "=== after teardown ==="
          awk '/^MemAvailable:/ { printf "MemAvailable %.0f MiB\n", $2/1024 }' /proc/meminfo
          docker ps --format 'table {{.Names}}\t{{.Status}}'
          REMOTE

      - name: Confirm production is still healthy
        env:
          ORACLE_HOST: ${{ vars.ORACLE_HOST }}
          ORACLE_USER: ${{ vars.ORACLE_USER }}
        run: |
          ssh "${ORACLE_USER}@${ORACLE_HOST}" bash -s <<'REMOTE'
          set -Eeuo pipefail
          container="$(docker ps -a --filter 'name=^telegram-news-agent-bot' --format '{{.Names}}' | head -1)"
          test -n "$container" || { echo "production bot container is missing" >&2; exit 1; }
          docker inspect --format \
            'ProductionBot running={{.State.Running}} restart_count={{.RestartCount}} oom_killed={{.State.OOMKilled}}' \
            "$container"
          test "$(docker inspect --format '{{.State.Running}}' "$container")" = "true" \
            || { echo "production bot is not running" >&2; exit 1; }
          REMOTE

  # Builds the immutable per-commit image. Deploys nothing.
  #
  # Merging to main used to ship straight to production, so a documentation fix
  # and a rewrite of the publish path restarted the live bot alike. Building and
  # releasing are now separate events: this one only makes the artifact.
  package:
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.value }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select immutable image name
        id: image
        run: echo "value=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: |
            linux/amd64
            linux/arm64
          push: true
          # Deliberately not `latest`. That tag now means "what production is
          # running", and it is moved by the release job -- not by whatever was
          # merged most recently, which has never been in production at all.
          tags: ${{ steps.image.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Turns a version tag into a release. Builds nothing.
  #
  # The artifact deployed is the one that was already built and tested for that
  # exact commit -- retagged, not rebuilt. A rebuild at release time ships
  # something that has never been through the gate, however identical the
  # source looks.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.resolve.outputs.image }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Check out the full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse anything that is not a releasable commit
        id: resolve
        run: |
          set -Eeuo pipefail
          version="${GITHUB_REF_NAME}"
          sha="${GITHUB_SHA}"

          # 1. Shape. The trigger already filters, but a tag is the thing that
          #    reaches production, so it is asserted rather than assumed.
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "refusing: '${version}' is not vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          # 2. Provenance. The commit must sit on a release snapshot branch.
          #    Tagging an arbitrary commit would put code in production that no
          #    release branch ever recorded, which is what the snapshot is for.
          branches="$(git branch -r --contains "$sha" --format '%(refname:short)' \
            | sed 's#^origin/##' | grep '^release/' || true)"
          if [[ -z "$branches" ]]; then
            echo "refusing: ${sha} is not on any release/* branch." >&2
            echo "Cut one from main first: git switch -c release/${version} main" >&2
            exit 1
          fi
          echo "On release branch(es): $(echo "$branches" | tr '\n' ' ')"

          # 3. Provable gate. The per-commit image exists only because the push
          #    that created it passed the full test gate. Its absence means this
          #    commit was never verified -- and no amount of source inspection
          #    at release time is a substitute for that.
          built="${IMAGE_NAME}:${sha}"
          if ! docker manifest inspect "$built" >/dev/null 2>&1; then
            echo "refusing: no image ${built}." >&2
            echo "That commit never finished CI, so it has never been tested." >&2
            exit 1
          fi

          # 4. The snapshot describes itself. package.json must carry the
          #    version being released, so the tag, the image and /status cannot
          #    disagree about what is running.
          declared="v$(node -p "require('./package.json').version")"
          if [[ "$declared" != "$version" ]]; then
            echo "refusing: package.json says ${declared}, the tag says ${version}." >&2
            echo "Bump it on the release branch, then move the tag." >&2
            exit 1
          fi

          {
            echo "version=${version}"
            echo "image=${IMAGE_NAME}:${version}"
            echo "built=${built}"
          } >> "$GITHUB_OUTPUT"

      - name: Retag the tested image as the release
        env:
          BUILT: ${{ steps.resolve.outputs.built }}
          RELEASE: ${{ steps.resolve.outputs.image }}
        run: |
          set -Eeuo pipefail
          # imagetools copies the manifest list, so both architectures come
          # across and no layer is rebuilt.
          docker buildx imagetools create --tag "$RELEASE" "$BUILT"
          docker buildx imagetools create --tag "${IMAGE_NAME}:latest" "$BUILT"
          echo "Released ${RELEASE} (and moved latest) from ${BUILT}"

  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Install pinned SOPS
        env:
          SOPS_VERSION: 3.13.3
          SOPS_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
        run: |
          install -d -m 700 "$RUNNER_TEMP/bin"
          curl --fail --silent --show-error --location \
            "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64" \
            --output "$RUNNER_TEMP/bin/sops"
          printf '%s  %s\n' "$SOPS_SHA256" "$RUNNER_TEMP/bin/sops" | sha256sum --check
          chmod 755 "$RUNNER_TEMP/bin/sops"
          printf '%s\n' "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Decrypt production environment
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          test -n "$SOPS_AGE_KEY"
          install -d -m 700 "$RUNNER_TEMP/sops"
          printf '%s\n' "$SOPS_AGE_KEY" > "$RUNNER_TEMP/sops/age-key.txt"
          chmod 600 "$RUNNER_TEMP/sops/age-key.txt"
          install -m 600 /dev/null "$RUNNER_TEMP/production.base.env"
          SOPS_AGE_KEY_FILE="$RUNNER_TEMP/sops/age-key.txt" \
            sops decrypt \
              --input-type dotenv \
              --output-type dotenv \
              secrets/production.env.sops > "$RUNNER_TEMP/production.base.env"
          ops/validate-production-env.sh --base "$RUNNER_TEMP/production.base.env"

      - name: Validate deployment configuration
        env:
          ORACLE_HOST: ${{ vars.ORACLE_HOST }}
          ORACLE_USER: ${{ vars.ORACLE_USER }}
        run: |
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_USER"
          install -m 600 "$RUNNER_TEMP/production.base.env" "$RUNNER_TEMP/production.env"
          ops/validate-production-env.sh --complete "$RUNNER_TEMP/production.env"

      - name: Upload deployment bundle
        env:
          ORACLE_HOST: ${{ vars.ORACLE_HOST }}
          ORACLE_USER: ${{ vars.ORACLE_USER }}
        run: |
          umask 077
          install -d -m 700 deployment/ops/postgres/init
          install -m 644 compose.yaml deployment/compose.yaml
          install -m 644 compose.ssh-access.yaml deployment/compose.ssh-access.yaml
          install -m 755 ops/deploy.sh deployment/ops/deploy.sh
          install -m 755 ops/configure-db-observer.sh deployment/ops/configure-db-observer.sh
          install -m 755 ops/validate-production-env.sh deployment/ops/validate-production-env.sh
          install -m 755 ops/verify-production-runtime.sh deployment/ops/verify-production-runtime.sh
          install -m 755 ops/notify-deployment.sh deployment/ops/notify-deployment.sh
          install -m 755 ops/postgres/init/00-create-app-role.sh deployment/ops/postgres/init/00-create-app-role.sh
          install -m 644 package.json deployment/package.json
          install -m 600 "$RUNNER_TEMP/production.env" deployment/.env.production.incoming
          tar -C deployment -czf deployment.tar.gz .
          chmod 600 deployment.tar.gz
          remote_archive="/tmp/telegram-news-agent-deployment-${GITHUB_SHA}.tar.gz"
          scp deployment.tar.gz "${ORACLE_USER}@${ORACLE_HOST}:${remote_archive}"
          ssh "${ORACLE_USER}@${ORACLE_HOST}" bash -s -- "$remote_archive" <<'REMOTE'
          set -Eeuo pipefail
          archive="$1"
          trap 'rm -f "$archive"' EXIT
          chmod 600 "$archive"
          install -d -m 750 /opt/telegram-news-agent
          tar -xzf "$archive" -C /opt/telegram-news-agent
          REMOTE

      - name: Log Oracle host in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORACLE_HOST: ${{ vars.ORACLE_HOST }}
          ORACLE_USER: ${{ vars.ORACLE_USER }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh "${ORACLE_USER}@${ORACLE_HOST}" \
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Deploy immutable image
        env:
          DEPLOY_IMAGE: ${{ needs.release.outputs.image }}
          ORACLE_HOST: ${{ vars.ORACLE_HOST }}
          ORACLE_USER: ${{ vars.ORACLE_USER }}
        run: |
          # The immutable image name is intentionally expanded on the runner.
          # shellcheck disable=SC2029
          ssh "${ORACLE_USER}@${ORACLE_HOST}" \
            /opt/telegram-news-agent/ops/deploy.sh "$DEPLOY_IMAGE"

      - name: Log Oracle host out of GHCR
        if: always()
        env:
          ORACLE_HOST: ${{ vars.ORACLE_HOST }}
          ORACLE_USER: ${{ vars.ORACLE_USER }}
        run: ssh "${ORACLE_USER}@${ORACLE_HOST}" 'docker logout ghcr.io' || true

      - name: Remove runner plaintext
        if: always()
        run: |
          rm -rf \
            "$RUNNER_TEMP/production.base.env" \
            "$RUNNER_TEMP/production.env" \
            "$RUNNER_TEMP/sops" \
            deployment \
            deployment.tar.gz
