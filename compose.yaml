name: telegram-news-agent

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: telegram_news
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=20
      - -c
      - wal_buffers=4MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telegram_news"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 384m
    shm_size: 64mb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ops/postgres/init/00-create-app-role.sh:/docker-entrypoint-initdb.d/00-create-app-role.sh:ro
    networks:
      - backend
    logging: *default-logging

  migrate:
    image: ${APP_IMAGE:-telegram-news-agent:local}
    environment:
      DATABASE_URL: postgresql://telegram_news_app:${POSTGRES_APP_PASSWORD}@db:5432/telegram_news
    command: ["node", "scripts/migrate.mjs"]
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m
    read_only: true
    tmpfs:
      - /tmp:size=16m
    networks:
      - backend
    logging: *default-logging

  bot:
    image: ${APP_IMAGE:-telegram-news-agent:local}
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://telegram_news_app:${POSTGRES_APP_PASSWORD}@db:5432/telegram_news
      DATABASE_POOL_MAX: 4
      APP_VERSION: ${APP_VERSION:-local}
    # The cutover switch, and therefore the rollback switch.
    #
    # Interpolated from the same --env-file deploy.sh already snapshots to
    # .env.production.rollback and restores in rollback(). That is the whole
    # point: rollback restores the image and the environment but NOT this file,
    # so a command written literally here would survive a rollback and the
    # restored image would start the wrong runtime.
    #
    # Defaults to the legacy entrypoint, so an environment that never mentions
    # it behaves exactly as before. ops/validate-production-env.sh rejects any
    # value other than the two known runtimes.
    #
    # One caveat for whoever reads this next: a BOT_ENTRYPOINT exported in the
    # shell that runs docker compose overrides --env-file, and rollback() would
    # not restore it. Nothing in the ssh deploy path exports it, and nothing
    # should start.
    command: ["node", "${BOT_ENTRYPOINT:-src/telegram-bot.js}"]
    # Decided inside the container, by the same variable that chose the
    # entrypoint. `$$` survives compose interpolation, so the shell that runs
    # in the container expands it from the container's own environment -- one
    # definition that is correct for whichever runtime this deployment starts.
    #
    # The typed runtime publishes a readiness snapshot and confirms its poller
    # lease against PostgreSQL, so an "up" container that owns no lease, or one
    # whose poller has stopped answering, reports unhealthy. The legacy runtime
    # publishes nothing: it is the frozen rollback and has no readiness
    # contract, so the probe exits 0 rather than inventing one for it. That
    # branch is not a check -- it is the honest statement that there is nothing
    # here to check -- and it leaves legacy gated exactly as it was, on
    # Running and RestartCount.
    healthcheck:
      test:
        - CMD-SHELL
        - 'case "$${BOT_ENTRYPOINT:-src/telegram-bot.js}" in dist/*) node dist/composition/health-cli.js ;; *) exit 0 ;; esac'
      # Longer than the 45s stale-heartbeat threshold would let a wedged
      # runtime linger; shorter than the poller's 70s lease-acquire timeout
      # would fail a runtime still legitimately waiting, which start_period
      # covers.
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 384m
    read_only: true
    tmpfs:
      - /tmp:size=32m
    stop_grace_period: 45s
    networks:
      - backend
    logging: *default-logging

volumes:
  postgres_data:

networks:
  backend:
